work_item_policy:
  stable_ids: true
  create_parallel_numbering_system: false
  statuses:
    - READY
    - BLOCKED
    - IN PROGRESS
    - QA
    - COMPLETE
    - DEFERRED
  completion_rule: "Do not claim COMPLETE merely because code exists."
  numeric_resource_rule: "Do not invent Sam-specific numeric resources outside the current Symbol Registry."

qa_policy:
  required_categories:
    - specialist_acceptance_tests
    - backlog_done_when
    - shared_qa_matrix
    - clean_build
    - save_load_and_reentry_for_stateful_features
    - focused_regression
  evidence_rule: "Record source commit used for QA separately from implementation branch state."

