name: Satoshi Router QA

on:
  pull_request:
    paths:
      - 'asm/macros/satoshi.inc'
      - 'data/maps/PewterCity_Gym/scripts.inc'
      - 'tools/qa/test_satoshi_router.py'
      - '.github/workflows/satoshi-router-qa.yml'

jobs:
  focused-router-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
      - name: Run focused Satoshi router QA
        run: python3 tools/qa/test_satoshi_router.py
