name: Apply Gym2 retired map/runtime reconciliation

on:
  push:
    branches:
      - sam/gym2-cerulean-reconcile-existing
    paths:
      - .github/workflows/apply-gym2-retired-map-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sam/gym2-cerulean-reconcile-existing
          fetch-depth: 0
      - name: Carry forward existing Cerulean map and flame runtime
        run: |
          git fetch origin sam-gym2-cerulean-complete
          git checkout origin/sam-gym2-cerulean-complete -- \
            data/layouts/CeruleanCity_Gym/map.bin \
            data/maps/CeruleanCity_Gym/map.json \
            data/maps/CeruleanCity_Gym/scripts.inc \
            data/maps/CeruleanCity_Gym/text.inc \
            data/tilesets/secondary/cerulean_gym/metatile_attributes.bin \
            data/tilesets/secondary/cerulean_gym/metatiles.bin \
            data/tilesets/secondary/cerulean_gym/tiles.png \
            graphics/trainer_card/badges.png

          rm .github/workflows/apply-gym2-retired-map-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/layouts/CeruleanCity_Gym/map.bin \
            data/maps/CeruleanCity_Gym/map.json \
            data/maps/CeruleanCity_Gym/scripts.inc \
            data/maps/CeruleanCity_Gym/text.inc \
            data/tilesets/secondary/cerulean_gym/metatile_attributes.bin \
            data/tilesets/secondary/cerulean_gym/metatiles.bin \
            data/tilesets/secondary/cerulean_gym/tiles.png \
            graphics/trainer_card/badges.png \
            .github/workflows/apply-gym2-retired-map-runtime.yml
          git commit -m "Gym2: carry forward existing Cerulean map and flame runtime"
          git push origin HEAD:sam/gym2-cerulean-reconcile-existing
