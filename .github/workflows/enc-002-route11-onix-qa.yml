name: ENC-002 Route 11 Onix QA

on:
  push:
    branches:
      - qa/enc-002-route11-onix
  workflow_dispatch:

jobs:
  onix-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: qa/enc-002-route11-onix
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          timeout 300s sudo apt-get update
          timeout 900s sudo apt-get install -y build-essential binutils-arm-none-eabi git libpng-dev

      - name: Build and install agbcc
        run: |
          set -euxo pipefail
          cd ..
          git clone https://github.com/pret/agbcc.git
          cd agbcc
          ./build.sh
          ./install.sh ../pokefirered

      - name: Verify production ancestry
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor 0f69b3f1889ac205d3bf51040ff29b5b0652a9e4 HEAD

      - name: Verify Onix static contract
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          constants = Path('include/constants/event_objects.h').read_text()
          assert '#define OBJ_EVENT_GFX_ONIX               165' in constants
          assert '#define NUM_OBJ_EVENT_GFX                166' in constants
          assert 'OBJ_EVENT_GFX_ONIX >= OBJ_EVENT_GFX_VARS' in constants

          flags = Path('include/constants/flags.h').read_text()
          assert '#define FLAG_STATIC_ROUTE11_ONIX_COMPLETE              0x365' in flags

          pointers = Path('src/data/object_events/object_event_graphics_info_pointers.h').read_text()
          assert 'const struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_Onix;' in pointers
          assert '[OBJ_EVENT_GFX_ONIX]                     = &gObjectEventGraphicsInfo_Onix' in pointers

          gfx = Path('src/onix_object_graphics.c').read_text()
          assert 'graphics/object_events/pics/pokemon/onix.4bpp' in gfx
          assert '#define OBJ_EVENT_PAL_TAG_RHYHORN 0x111D' in gfx
          assert '.width = 16' in gfx and '.height = 16' in gfx
          assert '.paletteSlot = PALSLOT_NPC_SPECIAL' in gfx
          assert '.tracks = TRACKS_NONE' in gfx
          assert 'extern const struct SubspriteTable gObjectEventSpriteOamTables_16x16[];' in gfx
          assert Path('graphics/object_events/pics/pokemon/onix.4bpp').stat().st_size == 9 * 128

          m = json.loads(Path('data/maps/Route11/map.json').read_text())
          assert m['weather'] == 'WEATHER_SANDSTORM'
          onix = [o for o in m['object_events'] if o.get('graphics_id') == 'OBJ_EVENT_GFX_ONIX']
          assert len(onix) == 1
          onix = onix[0]
          assert (onix['x'], onix['y'], onix['elevation']) == (10, 3, 3)
          assert onix['script'] == 'Route11_EventScript_StaticOnix'
          assert onix['flag'] == 'FLAG_STATIC_ROUTE11_ONIX_COMPLETE'

          awakening = [o for o in m['object_events'] if o.get('script') == 'Route11_EventScript_ItemAwakening']
          assert len(awakening) == 1
          assert (awakening[0]['x'], awakening[0]['y']) == (13, 3)
          assert (onix['x'], onix['y']) != (awakening[0]['x'], awakening[0]['y'])

          scripts = Path('data/maps/Route11/scripts.inc').read_text()
          required = [
              'setwildbattle SPECIES_ONIX, 24, ITEM_SOFT_SAND',
              'MOVE_ROCK_THROW', 'MOVE_SANDSTORM', 'MOVE_SAND_TOMB', 'MOVE_ROCK_TOMB',
              'goto_if_eq VAR_RESULT, B_OUTCOME_WON, Route11_EventScript_CompleteStaticOnix',
              'goto_if_eq VAR_RESULT, B_OUTCOME_CAUGHT, Route11_EventScript_CompleteStaticOnix',
              'setflag FLAG_STATIC_ROUTE11_ONIX_COMPLETE',
              'removeobject VAR_LAST_TALKED',
          ]
          for token in required:
              assert token in scripts, token

          battle_tail = scripts.split('specialvar VAR_RESULT, GetBattleOutcome', 1)[1].split('Route11_EventScript_CompleteStaticOnix::', 1)[0]
          assert 'B_OUTCOME_WON' in battle_tail and 'B_OUTCOME_CAUGHT' in battle_tail
          assert '\trelease\n\tend' in battle_tail
          assert 'setflag FLAG_STATIC_ROUTE11_ONIX_COMPLETE' not in battle_tail
          assert 'removeobject' not in battle_tail
          assert 'giveitem ITEM_SOFT_SAND' not in scripts

          weather = Path('include/constants/weather.h').read_text()
          assert '#define WEATHER_SANDSTORM          8' in weather

          print('ENC002 ROUTE11 ONIX STATIC CONTRACT PASS')
          print('Onix Lv24 @ Soft Sand / Rock Throw / Sandstorm / Sand Tomb / Rock Tomb')
          print('Route 11 weather: Sandstorm')
          PY

      - name: Build QA ROM
        run: |
          set -euxo pipefail
          make 2>&1 | tee ENC002_ONIX_BUILD.log
          test -f pokefirered.gba
          sha1sum pokefirered.gba | tee ENC002_ONIX_QA_ROM_SHA1.txt
          git rev-parse HEAD | tee ENC002_ONIX_QA_SOURCE_SHA.txt
          echo 0f69b3f1889ac205d3bf51040ff29b5b0652a9e4 | tee ENC002_ONIX_PRODUCTION_SOURCE_SHA.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enc-002-route11-onix-qa
          path: |
            pokefirered.gba
            ENC002_ONIX_BUILD.log
            ENC002_ONIX_QA_ROM_SHA1.txt
            ENC002_ONIX_QA_SOURCE_SHA.txt
            ENC002_ONIX_PRODUCTION_SOURCE_SHA.txt
          if-no-files-found: warn
