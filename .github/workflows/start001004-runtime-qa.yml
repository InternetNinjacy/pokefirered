name: START-001-004 Runtime QA

on:
  push:
    branches:
      - qa/start-001-004-runtime
  workflow_dispatch:

jobs:
  starter-runtime-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: qa/start-001-004-runtime

      - name: Install build and emulator dependencies
        run: |
          set -euxo pipefail
          sudo apt update
          sudo apt install -y build-essential binutils-arm-none-eabi git libpng-dev mgba-sdl
          mgba --version || true

      - name: Build and install agbcc
        run: |
          set -euxo pipefail
          cd ..
          git clone https://github.com/pret/agbcc.git
          cd agbcc
          ./build.sh
          ./install.sh ../pokefirered

      - name: Static Starter System assertions
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          items_doc = json.loads((root / "src/data/items.json").read_text())
          items = items_doc["items"] if isinstance(items_doc, dict) else items_doc
          by_id = {x.get("itemId"): x for x in items if isinstance(x, dict)}
          brick = by_id["ITEM_BRICK"]
          gene = by_id["ITEM_ADAPTIVE_GENE"]
          assert items[244]["itemId"] == "ITEM_BRICK"
          assert items[245]["itemId"] == "ITEM_ADAPTIVE_GENE"
          assert brick["price"] == 2100
          assert brick["fieldUseFunc"] == "FieldUseFunc_EvoItem"
          assert brick["battleUsage"] == 0
          assert brick["description_english"].replace("\\n", " ") == "A peculiar, heavy brick. It makes EEVEE evolve."
          assert gene["price"] == 0
          assert gene["pocket"] == "POCKET_ITEMS"
          assert gene["battleUsage"] == 0
          assert gene["description_english"].replace("\\n", " ") == "A strange gene that boosts the power of DITTO's moves."

          evo = (root / "src/data/pokemon/evolution.h").read_text()
          for token in [
              "ITEM_WATER_STONE, SPECIES_VAPOREON",
              "ITEM_THUNDER_STONE, SPECIES_JOLTEON",
              "ITEM_FIRE_STONE, SPECIES_FLAREON",
              "ITEM_SUN_STONE, SPECIES_ESPEON",
              "ITEM_MOON_STONE, SPECIES_UMBREON",
              "ITEM_LEAF_STONE, SPECIES_LEAFEON",
              "ITEM_BRICK, SPECIES_ECTOCEON",
          ]:
              assert token in evo

          oak = (root / "data/maps/PalletTown_ProfessorOaksLab/scripts.inc").read_text()
          trainer_parties = (root / "src/data/trainer_parties.h").read_text()
          squirtle_party = trainer_parties[trainer_parties.index("sParty_RivalOaksLabSquirtle"):trainer_parties.index("sParty_RivalOaksLabBulbasaur")]
          bulbasaur_party = trainer_parties[trainer_parties.index("sParty_RivalOaksLabBulbasaur"):trainer_parties.index("sParty_RivalOaksLabCharmander")]
          charmander_party = trainer_parties[trainer_parties.index("sParty_RivalOaksLabCharmander"):trainer_parties.index("sParty_RivalRoute22EarlySquirtle")]
          assert "SPECIES_PICHU" in squirtle_party
          assert "SPECIES_EEVEE" in bulbasaur_party
          assert "SPECIES_DITTO" in charmander_party
          assert "setvar PLAYER_STARTER_SPECIES, SPECIES_EEVEE" in oak
          assert "setvar PLAYER_STARTER_SPECIES, SPECIES_PICHU" in oak
          assert "setvar PLAYER_STARTER_SPECIES, SPECIES_DITTO" in oak
          assert "special GiveSamStarter" in oak
          assert "goto_if_ne VAR_STARTER_MON, 0, PalletTown_ProfessorOaksLab_EventScript_RivalPicksStarter" in oak

          for mapname in ["ViridianCity_Mart", "PewterCity_Mart"]:
              src = (root / f"data/maps/{mapname}/scripts.inc").read_text()
              for item in ["ITEM_FIRE_STONE","ITEM_THUNDER_STONE","ITEM_WATER_STONE","ITEM_LEAF_STONE","ITEM_SUN_STONE","ITEM_MOON_STONE","ITEM_BRICK"]:
                  assert item in src
          viridian = (root / "data/maps/ViridianCity_Mart/scripts.inc").read_text()
          assert "goto_if_ne VAR_STARTER_MON, 0, ViridianCity_Mart_EventScript_OpenShop" in viridian
          assert "goto_if_ne VAR_MAP_SCENE_VIRIDIAN_CITY_MART, 2, ViridianCity_Mart_EventScript_OpenShop" in viridian
          assert "setvar VAR_MAP_SCENE_VIRIDIAN_CITY_MART, 3" in viridian
          celadon = (root / "data/maps/CeladonCity_DepartmentStore_4F/scripts.inc").read_text()
          for item in ["ITEM_FIRE_STONE","ITEM_THUNDER_STONE","ITEM_WATER_STONE","ITEM_LEAF_STONE","ITEM_SUN_STONE","ITEM_MOON_STONE","ITEM_BRICK"]:
              assert item in celadon

          map_gene_refs = []
          for p in (root / "data/maps").rglob("*.inc"):
              if "ITEM_ADAPTIVE_GENE" in p.read_text(errors="ignore"):
                  map_gene_refs.append(str(p))
          assert map_gene_refs == [], map_gene_refs

          battle = (root / "src/battle_script_commands.c").read_text()
          assert "gBattleMoveDamage = ApplyAdaptiveGeneDamageModifier(gBattleMoveDamage, gBattlerAttacker);" in battle
          assert "GetMonData(&party[partyIndex], MON_DATA_SPECIES, NULL) == SPECIES_DITTO" in battle
          assert battle.count("ApplyAdaptiveGeneDamageModifier(gBattleMoveDamage, gBattlerAttacker)") == 1

          party_menu = (root / "src/party_menu.c").read_text()
          assert "GetEvolutionTargetSpecies(currentPokemon, EVO_MODE_ITEM_CHECK, item) != SPECIES_NONE" in party_menu
          assert "ExecuteTableBasedItemEffect_(gPartyMenu.slotId, gSpecialVar_ItemId, 0);" in party_menu
          assert "RemoveBagItem(gSpecialVar_ItemId, 1);" in party_menu
          item_menu = (root / "src/item_menu.c").read_text()
          assert "gSpecialVar_ItemId == ITEM_ADAPTIVE_GENE" in item_menu
          assert "sContextMenuItems_GiveIfNotKeyItemPocket[OPEN_BAG_ITEMS]" in item_menu
          assert "ItemId_GetPrice(gSpecialVar_ItemId) == 0" in item_menu

          learn = (root / "src/data/pokemon/level_up_learnsets.h").read_text()
          eevee = learn[learn.index("static const u16 sEeveeLevelUpLearnset"):learn.index("static const u16 sVaporeonLevelUpLearnset")]
          for token in [
              "LEVEL_UP_MOVE(1, MOVE_TACKLE)", "LEVEL_UP_MOVE(1, MOVE_TAIL_WHIP)",
              "LEVEL_UP_MOVE(5, MOVE_SAND_ATTACK)", "LEVEL_UP_MOVE(8, MOVE_GROWL)",
              "LEVEL_UP_MOVE(11, MOVE_QUICK_ATTACK)", "LEVEL_UP_MOVE(14, MOVE_BITE)"
          ]:
              assert token in eevee
          assert "LEVEL_UP_MOVE(15," not in eevee and "LEVEL_UP_MOVE(16," not in eevee

          ditto = learn[learn.index("static const u16 sDittoLevelUpLearnset"):learn.index("static const u16 sEeveeLevelUpLearnset")]
          for token in [
              "LEVEL_UP_MOVE(1, MOVE_TRANSFORM)", "LEVEL_UP_MOVE(1, MOVE_TACKLE)",
              "LEVEL_UP_MOVE(10, MOVE_MIMIC)", "LEVEL_UP_MOVE(20, MOVE_SWIFT)",
              "LEVEL_UP_MOVE(30, MOVE_SUBSTITUTE)", "LEVEL_UP_MOVE(40, MOVE_RECOVER)",
              "LEVEL_UP_MOVE(50, MOVE_TRI_ATTACK)"
          ]:
              assert token in ditto

          tm = (root / "src/data/pokemon/tmhm_learnsets.h").read_text()
          ditto_tm = tm[tm.index("[SPECIES_DITTO] = TMHM_LEARNSET"):tm.index("[SPECIES_EEVEE] = TMHM_LEARNSET")]
          for n in range(1, 69):
              assert f"TM{n:02d}_" in ditto_tm, n
          for n in range(1, 9):
              assert f"HM{n:02d}_" in ditto_tm, n
          for species, next_species in [("PICHU","CLEFFA"),("PIKACHU","RAICHU"),("RAICHU","SANDSHREW")]:
              block = tm[tm.index(f"[SPECIES_{species}] = TMHM_LEARNSET"):tm.index(f"[SPECIES_{next_species}] = TMHM_LEARNSET")]
              assert "HM03_SURF" in block
              assert "FIRE_PUNCH" not in block and "ICE_PUNCH" not in block

          info = (root / "src/data/pokemon/species_info.h").read_text()
          for species, values in [
              ("EEVEE", [".baseHP = 55", ".baseAttack = 55", ".baseDefense = 50", ".baseSpeed = 55", ".baseSpAttack = 45", ".baseSpDefense = 65", "ABILITY_RUN_AWAY"]),
              ("PICHU", [".baseHP = 45", ".baseAttack = 45", ".baseDefense = 35", ".baseSpeed = 80", ".baseSpAttack = 65", ".baseSpDefense = 45", "ABILITY_STATIC"]),
              ("PIKACHU", [".baseHP = 55", ".baseAttack = 55", ".baseDefense = 45", ".baseSpeed = 95", ".baseSpAttack = 90", ".baseSpDefense = 65", "ABILITY_STATIC"]),
              ("RAICHU", [".baseHP = 75", ".baseAttack = 80", ".baseDefense = 65", ".baseSpeed = 110", ".baseSpAttack = 115", ".baseSpDefense = 80", "ABILITY_STATIC"]),
              ("DITTO", [".baseHP = 65", ".baseAttack = 65", ".baseDefense = 65", ".baseSpeed = 65", ".baseSpAttack = 65", ".baseSpDefense = 65", "ABILITY_LIMBER"]),
          ]:
              start = info.index(f"[SPECIES_{species}] =")
              block = info[start:start+1600]
              for value in values:
                  assert value in block, (species, value)

          oak_text = (root / "data/maps/PalletTown_ProfessorOaksLab/text.inc").read_text()
          vir_text = (root / "data/maps/ViridianCity_Mart/text.inc").read_text()
          pew_text = (root / "data/maps/PewterCity_Mart/text.inc").read_text()
          for phrase in ["EEVEE is a little different from", "It stops learning new moves on", "By around Lv. 15, you'll want"]:
              assert phrase in oak_text
          for phrase in ["That EEVEE of yours can evolve", "We carry evolution items here", "Lv. 15 in mind."]:
              assert phrase in vir_text
          for phrase in ["Still deciding what to do with", "after Lv. 14 it won't learn new", "Lv. 16 onward."]:
              assert phrase in pew_text

          print("STARTQA STATIC PASS items shops mappings evolutions species TMs tutorials consumption transfer unique-source damage-hook")
          PY

      - name: Starter regression source assertions
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          item_effects = (root / "src/data/pokemon/item_effects.h").read_text()
          for name in ["FireStone", "ThunderStone", "WaterStone", "LeafStone", "Brick"]:
              assert f"sItemEffect_{name}" in item_effects

          battle = (root / "src/battle_script_commands.c").read_text()
          assert battle.count("ApplyAdaptiveGeneDamageModifier(gBattleMoveDamage, gBattlerAttacker)") == 1
          transform_start = battle.rindex("static void Cmd_transformdataexecution(void)\n{")
          transform_end = battle.index("static void Cmd_setsubstitute(void)", transform_start)
          assert "AdaptiveGene" not in battle[transform_start:transform_end]
          for start_token, end_token in [
              ("static void Cmd_dmgtolevel(void)\n{", "static void Cmd_psywavedamageeffect(void)"),
              ("static void Cmd_psywavedamageeffect(void)\n{", "static void Cmd_counterdamagecalculator(void)"),
              ("static void Cmd_tryKO(void)\n{", "static void Cmd_damagetohalftargethp(void)"),
              ("static void Cmd_weatherdamage(void)\n{", "static void Cmd_tryinfatuating(void)"),
          ]:
              start = battle.rindex(start_token)
              end = battle.index(end_token, start + len(start_token))
              assert "ApplyAdaptiveGeneDamageModifier" not in battle[start:end]

          bs = (root / "data/battle_scripts_1.s").read_text()
          conf = bs[bs.index("BattleScript_DoSelfConfusionDmg::"):bs.index("BattleScript_MoveUsedIsConfusedRet::")]
          assert "damagecalc" not in conf
          assert "adjustnormaldamage2" in conf
          assert "HITMARKER_PASSIVE_DAMAGE" in conf

          stone_tokens = ["ITEM_FIRE_STONE","ITEM_THUNDER_STONE","ITEM_WATER_STONE","ITEM_LEAF_STONE","ITEM_SUN_STONE","ITEM_MOON_STONE"]
          stone_shops = []
          for p in (root / "data/maps").rglob("scripts.inc"):
              txt = p.read_text(errors="ignore")
              if "pokemart" in txt and any(t in txt for t in stone_tokens):
                  stone_shops.append(str(p))
                  assert "ITEM_BRICK" in txt, p
          assert stone_shops

          map_gene_refs = [str(p) for p in (root / "data/maps").rglob("*.inc") if "ITEM_ADAPTIVE_GENE" in p.read_text(errors="ignore")]
          assert map_gene_refs == [], map_gene_refs

          party = (root / "src/party_menu.c").read_text()
          gate = party.index("noEffect = PokemonItemUseNoEffect")
          remove = party.index("RemoveBagItem(gSpecialVar_ItemId, 1);", gate)
          assert "if (noEffect)" in party[gate:remove]
          assert "Task_DoUseItemAnim(taskId);" in party[gate:remove]

          constants = (root / "include/constants/pokemon.h").read_text()
          assert "#define EVOS_PER_MON 7" in constants
          species = (root / "include/constants/species.h").read_text()
          for token in ["SPECIES_LEAFEON", "SPECIES_ECTOCEON", "SPECIES_RHYPERIOR"]:
              assert token in species

          util = (root / "src/script_pokemon_util.c").read_text()
          assert "u8 ScriptGiveMon(" in util
          assert "u8 ScriptGiveSamStarter(" in util

          print("STARTQA REGRESSION PASS stones shops gene exclusions confusion transform gift path indexing consumption")
          PY

      - name: Build QA ROM
        run: |
          set -euxo pipefail
          make
          test -f pokefirered.gba
          sha1sum pokefirered.gba | tee START001004_ROM_SHA1.txt
          git rev-parse HEAD | tee START001004_SOURCE_SHA.txt

      - name: Runtime phase 1
        run: |
          set -euxo pipefail
          rm -f pokefirered.sav
          export SDL_VIDEODRIVER=dummy
          export SDL_AUDIODRIVER=dummy
          timeout --signal=TERM 10s mgba -l 31 pokefirered.gba > start001004_phase1.log 2>&1 || test $? -eq 124 -o $? -eq 143
          cat start001004_phase1.log
          grep -q "STARTQA PHASE1 PASS starter mapping evolution gene state saved" start001004_phase1.log
          test -f pokefirered.sav

      - name: Runtime phase 2
        run: |
          set -euxo pipefail
          export SDL_VIDEODRIVER=dummy
          export SDL_AUDIODRIVER=dummy
          timeout --signal=TERM 10s mgba -l 31 pokefirered.gba > start001004_phase2.log 2>&1 || test $? -eq 124 -o $? -eq 143
          cat start001004_phase2.log
          grep -q "STARTQA PASS runtime starter mapping evolution gene rounding save reload" start001004_phase2.log

      - name: Reject QA failure markers
        run: |
          set -euxo pipefail
          ! grep -h "STARTQA FAIL" start001004_phase*.log

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: start-001-004-runtime-qa
          path: |
            pokefirered.gba
            pokefirered.sav
            START001004_ROM_SHA1.txt
            START001004_SOURCE_SHA.txt
            start001004_phase1.log
            start001004_phase2.log
          if-no-files-found: error
