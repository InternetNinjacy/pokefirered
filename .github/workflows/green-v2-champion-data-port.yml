name: Green v2 Champion data port
on:
  push:
    branches:
      - sam/green-main-rival-production-v2

permissions:
  contents: write

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sam/green-main-rival-production-v2
          fetch-depth: 0
      - name: Port recovered Green Champion data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick 2b2c70d29995c2fe952427b2ee0478f788abd66c
          git cherry-pick f9b61256f20d87d3b806e390ef5e9c7684a29f8a
          git rm .github/workflows/green-v2-champion-data-port.yml
          git commit -m "Green: remove temporary Champion data port workflow"
          git push origin HEAD:sam/green-main-rival-production-v2
