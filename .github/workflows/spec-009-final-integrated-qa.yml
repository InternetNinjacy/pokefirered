name: SPEC-009 Final Integrated QA

on:
  push:
    branches:
      - qa/spec-009-final-integrated
  workflow_dispatch:

jobs:
  integrated-spec009:
    runs-on: ubuntu-24.04
    env:
      PROD_SHA: 4e794f0f180a664176e400e81466711b983a59c3
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euxo pipefail
          timeout 300s sudo apt-get update
          timeout 900s sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi git libpng-dev mgba-sdl
          mgba --version || true

      - name: Build and install agbcc
        run: |
          set -euxo pipefail
          cd ..
          git clone https://github.com/pret/agbcc.git
          cd agbcc
          ./build.sh
          ./install.sh ../pokefirered

      - name: Verify exact production ancestry and integrated static contract
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor "$PROD_SHA" HEAD
          test "$(git rev-parse HEAD^)" != "$PROD_SHA" || true
          git merge-base --is-ancestor "$PROD_SHA" "$(git rev-parse HEAD^)"
          python3 - <<'PY'
          from pathlib import Path
          import struct

          def text(path): return Path(path).read_text()
          species=text('include/constants/species.h')
          for token in ['#define SPECIES_LEAFEON 412','#define SPECIES_ECTOCEON 413','#define SPECIES_RHYPERIOR 414','#define SPECIES_EGG 415','#define NUM_SPECIES SPECIES_EGG']:
              assert token in species, token
          assert 'GLACEON' not in species.upper()

          pokemon=text('src/pokemon.c')
          globalh=text('include/global.h')
          assert 'static const u16 sSpeciesToNationalPokedexNum[NUM_SPECIES - 1]' in pokemon
          assert '#define DEX_FLAGS_NO ROUND_BITS_TO_BYTES(NUM_SPECIES)' in globalh
          for token in ['[SPECIES_LEAFEON - 1] = SAM_DEX_FLAG_LEAFEON','[SPECIES_ECTOCEON - 1] = SAM_DEX_FLAG_ECTOCEON','[SPECIES_RHYPERIOR - 1] = SAM_DEX_FLAG_RHYPERIOR']:
              assert token in pokemon, token

          combined='\n'.join(p.read_text(errors='ignore') for p in [Path('src/pokemon.c'),Path('include/constants/sam_pokedex.h')] if p.exists())
          for token in ['SAM_DEX_LEAFEON','SAM_DEX_ECTOCEON','SAM_DEX_RHYPERIOR']:
              assert token in combined, token

          evo=text('src/data/pokemon/evolution.h')
          for token in ['{EVO_ITEM, ITEM_LEAF_STONE, SPECIES_LEAFEON}','{EVO_ITEM, ITEM_BRICK, SPECIES_ECTOCEON}','[SPECIES_RHYDON]     = {{EVO_ITEM, ITEM_PROTECTOR, SPECIES_RHYPERIOR}}']:
              assert token in evo, token

          cries=text('src/data/pokemon/cry_ids.h')
          for token in ['[SPECIES_LEAFEON - HOENN_MON_SPECIES_START] = SPECIES_EEVEE - 1','[SPECIES_ECTOCEON - HOENN_MON_SPECIES_START] = SPECIES_VAPOREON - 1','[SPECIES_RHYPERIOR - HOENN_MON_SPECIES_START] = SPECIES_RHYDON - 1']:
              assert token in cries, token

          info=text('src/data/pokemon/species_info.h')
          ability=text('src/pokemon.c')
          a=info.index('[SPECIES_ECTOCEON] ='); b=info.index('[SPECIES_RHYPERIOR] =',a)
          assert '.abilities = {ABILITY_SOUL_ROT, ABILITY_NONE}' in info[a:b]
          assert 'attacker->ability == ABILITY_SOUL_ROT' in ability
          assert 'damage = (130 * damage) / 100;' in ability
          assert 'STATUS1_PSN_ANY' in ability

          tm=text('src/data/pokemon/tmhm_learnsets.h')
          def block(name,nextname=None):
              a=tm.index(f'[SPECIES_{name}] =')
              b=tm.index(f'[SPECIES_{nextname}] =',a) if nextname else len(tm)
              return tm[a:b]
          l=block('LEAFEON','ECTOCEON'); e=block('ECTOCEON','RHYPERIOR'); r=block('RHYPERIOR')
          for t in ['TM01_BODY_SLAM','TM14_TOXIC','TM43_GIGA_DRAIN','TM44_SEED_STRIKE','TM45_SOLAR_BEAM','TM53_REFLECT','TM68_HIDDEN_POWER']: assert t in l, t
          for t in ['TM15_POISON_FANG','TM16_SLUDGE_BOMB','TM28_SHADOW_PUNCH','TM29_SHADOW_BALL','TM30_GHOSTLY_WAIL','TM64_THIEF','TM65_CRUNCH','TM67_TAUNT','HM02_FLY']: assert t in e, t
          assert 'TM39_WILL_O_WISP' not in e and 'TM33_NIGHT_TERROR' not in e
          assert 'TM27_MEGAHORN' in r

          macro_tables={
            'src/data/pokemon_graphics/front_pic_table.h':'SPECIES_SPRITE',
            'src/data/pokemon_graphics/back_pic_table.h':'SPECIES_SPRITE',
            'src/data/pokemon_graphics/palette_table.h':'SPECIES_PAL',
            'src/data/pokemon_graphics/shiny_palette_table.h':'SPECIES_SHINY_PAL',
          }
          indexed_tables=[
            'src/data/pokemon_graphics/front_pic_coordinates.h',
            'src/data/pokemon_graphics/back_pic_coordinates.h',
            'src/data/pokemon_graphics/footprint_table.h',
            'src/pokemon_icon.c',
          ]
          for path,macro in macro_tables.items():
              s=text(path)
              for mon in ['LEAFEON','ECTOCEON','RHYPERIOR']:
                  assert f'{macro}({mon},' in s, (path,mon)
          for path in indexed_tables:
              s=text(path)
              for mon in ['LEAFEON','ECTOCEON','RHYPERIOR']:
                  assert f'[SPECIES_{mon}]' in s, (path,mon)

          def png_info(path):
              data=Path(path).read_bytes(); assert data[:8]==b'\x89PNG\r\n\x1a\n'
              w,h,depth,ctype=struct.unpack('>IIBB',data[16:26])
              return w,h,depth,ctype
          for mon in ['leafeon','ectoceon','rhyperior']:
              d=Path('graphics/pokemon')/mon
              for name,wh in [('front.png',(64,64)),('back.png',(64,64)),('icon.png',(32,64))]:
                  p=d/name; assert p.exists(), p
                  w,h,depth,ctype=png_info(p); assert (w,h)==wh, (p,w,h); assert ctype==3, (p,ctype)
              for name in ['normal.pal','shiny.pal']:
                  assert (d/name).exists(), d/name
          assert Path('graphics/pokemon/rhyperior/footprint.png').exists()

          for p in [Path('include/constants/species.h'),Path('src/data/pokemon/species_info.h'),Path('src/data/pokemon/evolution.h'),Path('src/data/pokemon/cry_ids.h')]:
              assert 'GLACEON' not in p.read_text(errors='ignore').upper(), p
          print('SPEC009 FINAL STATIC PASS')
          PY

      - name: Full Sam-compatible production build COMPARE=0
        run: |
          set -euxo pipefail
          make -j2 COMPARE=0 all
          test -f pokefirered.gba
          sha1sum pokefirered.gba | tee SPEC009_FINAL_AGBCC_ROM_SHA1.txt
          git rev-parse "$PROD_SHA" | tee SPEC009_FINAL_PRODUCTION_SHA.txt

      - name: Runtime bounds persistence and dex regression on combined head
        run: |
          set -euxo pipefail
          make clean || true
          git fetch origin qa/spec-009-bounds-save-load:refs/remotes/origin/qa/spec-009-bounds-save-load
          git show origin/qa/spec-009-bounds-save-load:src/spec_009_bounds_save_qa.c > src/spec_009_bounds_save_qa.c
          python3 - <<'PY'
          from pathlib import Path
          p=Path('include/config.h'); s=p.read_text(); s=s.replace('#define LOG_HANDLER (LOG_HANDLER_AGB_PRINT)','#define LOG_HANDLER (LOG_HANDLER_MGBA_PRINT)'); p.write_text(s)
          p=Path('src/main.c'); s=p.read_text(); s=s.replace('extern u32 intr_main[];','extern u32 intr_main[];\nvoid Spec009BoundsSaveQa_Run(void);',1); marker='#if REVISION >= 1\n    if (gFlashMemoryPresent != TRUE)'; s=s.replace(marker,'Spec009BoundsSaveQa_Run();\n\n'+marker,1); p.write_text(s)
          PY
          make -j2 COMPARE=0 all
          rm -f pokefirered.sav
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          set +e; timeout --signal=TERM 25s mgba -l 31 pokefirered.gba > spec009_final_bounds_phase1.log 2>&1; rc=$?; set -e
          test "$rc" -eq 124 -o "$rc" -eq 143
          grep -q 'SPEC009BOUNDS PHASE1 PASS indexes party box dex saved' spec009_final_bounds_phase1.log
          test -f pokefirered.sav
          set +e; timeout --signal=TERM 25s mgba -l 31 pokefirered.gba > spec009_final_bounds_phase2.log 2>&1; rc=$?; set -e
          test "$rc" -eq 124 -o "$rc" -eq 143
          grep -q 'SPEC009BOUNDS QA PASS bounds and save reload' spec009_final_bounds_phase2.log
          ! grep -q 'SPEC009BOUNDS FAIL' spec009_final_bounds_phase1.log
          ! grep -q 'SPEC009BOUNDS FAIL' spec009_final_bounds_phase2.log

      - name: Restore clean integrated head
        run: |
          set -euxo pipefail
          git checkout -- include/config.h src/main.c
          rm -f src/spec_009_bounds_save_qa.c pokefirered.sav
          make clean || true

      - name: Runtime trade transfer safety regression on combined head
        run: |
          set -euxo pipefail
          git fetch origin qa/spec-009-trade-transfer-safety:refs/remotes/origin/qa/spec-009-trade-transfer-safety
          git show origin/qa/spec-009-trade-transfer-safety:src/spec_009_trade_safety_qa.c > src/spec_009_trade_safety_qa.c
          python3 - <<'PY'
          from pathlib import Path
          p=Path('include/config.h'); s=p.read_text(); s=s.replace('#define LOG_HANDLER (LOG_HANDLER_AGB_PRINT)','#define LOG_HANDLER (LOG_HANDLER_MGBA_PRINT)'); p.write_text(s)
          p=Path('src/main.c'); s=p.read_text(); s=s.replace('extern u32 intr_main[];','extern u32 intr_main[];\nvoid Spec009TradeSafetyQa_RunRuntimeQa(void);',1); marker='#if REVISION >= 1\n    if (gFlashMemoryPresent != TRUE)'; s=s.replace(marker,'Spec009TradeSafetyQa_RunRuntimeQa();\n\n'+marker,1); p.write_text(s)
          PY
          make -j2 COMPARE=0 all
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          set +e; timeout --signal=TERM 20s mgba -l 31 pokefirered.gba > spec009_final_trade.log 2>&1; rc=$?; set -e
          test "$rc" -eq 124 -o "$rc" -eq 143
          grep -q 'SPEC009TRADE QA PASS cable RFU custom safety stock unchanged' spec009_final_trade.log
          ! grep -q 'SPEC009TRADE QA FAIL' spec009_final_trade.log

      - name: Prove QA instrumentation is evidence-only
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor "$PROD_SHA" HEAD
          git diff --exit-code "$PROD_SHA" HEAD -- . ':!.github/workflows/spec-009-final-integrated-qa.yml'

      - name: Upload integrated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-009-final-integrated-qa
          path: |
            SPEC009_FINAL_AGBCC_ROM_SHA1.txt
            SPEC009_FINAL_PRODUCTION_SHA.txt
            spec009_final_bounds_phase1.log
            spec009_final_bounds_phase2.log
            spec009_final_trade.log
          if-no-files-found: warn
