name: Thomas trainer foundation source edit

on:
  push:
    branches:
      - sam/thomas-chunk1-trainer-foundation-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Thomas trainer foundation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Central trainer IDs.
          path = Path('include/constants/opponents.h')
          text = path.read_text()
          if 'TRAINER_THOMAS_NUGGET_BRIDGE' not in text:
              marker = '''#define TRAINER_LEADER_SURGE_REMATCH_VERMILION      783\n'''
              insert = '''#define TRAINER_LEADER_SURGE_REMATCH_VERMILION      783\n\n// Thomas Team Rocket rival allocations: 784-789.\n#define TRAINER_THOMAS_NUGGET_BRIDGE               784\n#define TRAINER_THOMAS_CELADON_HIDEOUT             785\n#define TRAINER_THOMAS_POKEMON_TOWER               786\n#define TRAINER_THOMAS_SILPH_CO                     787\n#define TRAINER_THOMAS_CINNABAR_MANSION            788\n#define TRAINER_THOMAS_VIRIDIAN_GYM                 789\n'''
              if marker not in text:
                  raise SystemExit('opponents.h insertion marker not found')
              text = text.replace(marker, insert, 1)
          text = text.replace('#define NUM_TRAINERS                             784', '#define NUM_TRAINERS                             790')
          path.write_text(text)

          # 2) Bind staged Thomas party header into data compilation.
          path = Path('src/data.c')
          text = path.read_text()
          include = '#include "data/sam_thomas_trainer_parties.h"\n'
          if include not in text:
              marker = '#include "data/trainer_parties.h"\n'
              if marker not in text:
                  raise SystemExit('src/data.c trainer party include marker not found')
              text = text.replace(marker, marker + include, 1)
          path.write_text(text)

          # 3) Six usable gTrainers records, no map integration.
          path = Path('src/data/trainers.h')
          text = path.read_text()
          if '[TRAINER_THOMAS_NUGGET_BRIDGE]' not in text:
              records = r'''
    [TRAINER_THOMAS_NUGGET_BRIDGE] = {
        .trainerClass = TRAINER_CLASS_PKMN_TRAINER,
        .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_MALE,
        .trainerPic = TRAINER_PIC_COOLTRAINER_M,
        .trainerName = _("THOMAS"),
        .items = {},
        .doubleBattle = FALSE,
        .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE | AI_SCRIPT_TRY_TO_FAINT,
        .party = NO_ITEM_CUSTOM_MOVES(sParty_ThomasNugget),
    },
    [TRAINER_THOMAS_CELADON_HIDEOUT] = {
        .trainerClass = TRAINER_CLASS_TEAM_ROCKET,
        .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_SUSPICIOUS,
        .trainerPic = TRAINER_PIC_ROCKET_GRUNT_M,
        .trainerName = _("THOMAS"),
        .items = {},
        .doubleBattle = FALSE,
        .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE | AI_SCRIPT_TRY_TO_FAINT | AI_SCRIPT_CHECK_VIABILITY,
        .party = NO_ITEM_CUSTOM_MOVES(sParty_ThomasCeladon),
    },
    [TRAINER_THOMAS_POKEMON_TOWER] = {
        .trainerClass = TRAINER_CLASS_TEAM_ROCKET,
        .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_SUSPICIOUS,
        .trainerPic = TRAINER_PIC_ROCKET_GRUNT_M,
        .trainerName = _("THOMAS"),
        .items = {},
        .doubleBattle = FALSE,
        .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE | AI_SCRIPT_TRY_TO_FAINT | AI_SCRIPT_CHECK_VIABILITY,
        .party = NO_ITEM_CUSTOM_MOVES(sParty_ThomasPokemonTower),
    },
    [TRAINER_THOMAS_SILPH_CO] = {
        .trainerClass = TRAINER_CLASS_TEAM_ROCKET,
        .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_SUSPICIOUS,
        .trainerPic = TRAINER_PIC_ROCKET_GRUNT_M,
        .trainerName = _("THOMAS"),
        .items = {},
        .doubleBattle = FALSE,
        .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE | AI_SCRIPT_TRY_TO_FAINT | AI_SCRIPT_CHECK_VIABILITY,
        .party = ITEM_CUSTOM_MOVES(sParty_ThomasSilph),
    },
    [TRAINER_THOMAS_CINNABAR_MANSION] = {
        .trainerClass = TRAINER_CLASS_TEAM_ROCKET,
        .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_SUSPICIOUS,
        .trainerPic = TRAINER_PIC_ROCKET_GRUNT_M,
        .trainerName = _("THOMAS"),
        .items = {},
        .doubleBattle = FALSE,
        .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE | AI_SCRIPT_TRY_TO_FAINT | AI_SCRIPT_CHECK_VIABILITY,
        .party = ITEM_CUSTOM_MOVES(sParty_ThomasCinnabar),
    },
    [TRAINER_THOMAS_VIRIDIAN_GYM] = {
        .trainerClass = TRAINER_CLASS_TEAM_ROCKET,
        .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_SUSPICIOUS,
        .trainerPic = TRAINER_PIC_ROCKET_GRUNT_M,
        .trainerName = _("THOMAS"),
        .items = {},
        .doubleBattle = FALSE,
        .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE | AI_SCRIPT_TRY_TO_FAINT | AI_SCRIPT_CHECK_VIABILITY,
        .party = ITEM_CUSTOM_MOVES(sParty_ThomasViridian),
    },
'''
              closing = '    };'
              pos = text.rfind(closing)
              if pos == -1:
                  raise SystemExit('src/data/trainers.h final array close not found')
              text = text[:pos] + records + text[pos:]
          path.write_text(text)
          PY

          git config user.name "InternetNinjacy"
          git config user.email "45226145+InternetNinjacy@users.noreply.github.com"
          git add include/constants/opponents.h src/data.c src/data/trainers.h
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "THOMAS: bind six trainer records"
          git push origin HEAD:sam/thomas-chunk1-trainer-foundation-v2
