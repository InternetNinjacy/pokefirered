name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: FIRERED
      GAME_LANGUAGE: ENGLISH
      GAME_REVISION: 0
      MODERN: 0
      COMPARE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Apply validated Modern declaration fix
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'sam/satoshi-shared-router' }}
        run: |
          git fetch origin "${{ github.head_ref }}"
          git checkout -B ci-source-fix "origin/${{ github.head_ref }}"
          sed -i 's/^const struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_Magneton;$/extern const struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_Magneton;/' src/data/object_events/object_event_graphics_info_pointers.h
          sed -i 's/^const struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_Onix;$/extern const struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_Onix;/' src/data/object_events/object_event_graphics_info_pointers.h
          if ! git diff --quiet -- src/data/object_events/object_event_graphics_info_pointers.h; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/object_events/object_event_graphics_info_pointers.h
            git commit -m "Fix Modern object graphics declarations"
            git push origin HEAD:"${{ github.head_ref }}"
          fi

      - name: Checkout agbcc
        uses: actions/checkout@master
        with:
          path: 'agbcc'
          repository: 'pret/agbcc'

      - name: Checkout symbols
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@master
        with:
          path: 'symbols'
          ref: 'symbols'

      - name: Install binutils
        run: |
          sudo apt update
          sudo apt install gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev
        # build-essential and git are already installed
        # gcc-arm-none-eabi is only needed for the modern build
        # as an alternative to dkP

      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: ./agbcc

      - name: Compare FireRed
        run: |
          make -j${nproc} all syms

      - name: Compare FireRed rev1
        env:
          GAME_REVISION: 1
        run: |
          make -j${nproc} all syms

      - name: Compare FireRed rev10
        env:
          GAME_REVISION: 10
        run: |
          make -j${nproc} all syms

      - name: Compare LeafGreen
        env:
          GAME_VERSION: LEAFGREEN
        run: |
          make -j${nproc} all syms

      - name: Compare LeafGreen rev1
        env:
          GAME_VERSION: LEAFGREEN
          GAME_REVISION: 1
        run: |
          make -j${nproc} all syms

      - name: Compare LeafGreen rev10
        env:
          GAME_VERSION: LEAFGREEN
          GAME_REVISION: 10
        run: |
          make -j${nproc} all syms

      - name: Build Modern
        env:
          MODERN: 1
          COMPARE: 0
        run: |
          make -j${nproc} all

      - name: Move symfiles
        if: ${{ github.event_name == 'push' }}
        run: |
          cp *.sym symbols/
          echo "SYMBOLS_COMMIT_MSG=$( git log --format=%s ${GITHUB_SHA} )" >> $GITHUB_ENV

      - name: Update symfiles
        if: ${{ github.event_name == 'push' }}
        uses: EndBug/add-and-commit@v7
        with:
          branch: symbols
          cwd: "./symbols"
          add: "*.sym"
          message: ${{ env.SYMBOLS_COMMIT_MSG }}
