name: Thomas Chunk 4 Source Edit

on:
  push:
    branches:
      - sam/thomas-chunk4-persistent-characteristics

permissions:
  contents: write

jobs:
  apply-source-delta:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sam/thomas-chunk4-persistent-characteristics
          fetch-depth: 2

      - name: Apply Thomas persistent-characteristic hook
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/battle_main.c")
          text = path.read_text()

          prototype_anchor = "static u8 CreateNPCTrainerParty(struct Pokemon *party, u16 trainerNum);\n"
          prototype_delta = prototype_anchor + "static bool8 IsThomasTrainer(u16 trainerNum);\nstatic u32 GetThomasTrainerMonPersonality(u16 trainerNum, u16 species, u32 fallbackPersonality);\nstatic void ApplyThomasTrainerMonOverrides(u16 trainerNum, u16 species, struct Pokemon *mon);\n"
          if prototype_anchor not in text:
              raise SystemExit("CreateNPCTrainerParty prototype anchor not found")
          text = text.replace(prototype_anchor, prototype_delta, 1)

          function_anchor = "static u8 CreateNPCTrainerParty(struct Pokemon *party, u16 trainerNum)\n{\n"
          helpers = r'''static bool8 IsThomasTrainer(u16 trainerNum)
          {
              return trainerNum >= TRAINER_THOMAS_NUGGET_BRIDGE
                  && trainerNum <= TRAINER_THOMAS_VIRIDIAN_GYM;
          }

          static u32 GetThomasTrainerMonPersonality(u16 trainerNum, u16 species, u32 fallbackPersonality)
          {
              if (!IsThomasTrainer(trainerNum))
                  return fallbackPersonality;

              switch (species)
              {
              case SPECIES_HORSEA:
              case SPECIES_SEADRA:
              case SPECIES_KINGDRA:
                  return 0x00000AFF; // Modest, male; same Horsea-line identity.
              case SPECIES_MACHOP:
              case SPECIES_MACHOKE:
              case SPECIES_MACHAMP:
                  return 0x000008FF; // Adamant, male; same Machop-line identity.
              case SPECIES_HOUNDOUR:
              case SPECIES_HOUNDOOM:
                  return 0x000005FF; // Timid, male, ability slot 1 (Flash Fire).
              case SPECIES_BALTOY:
              case SPECIES_CLAYDOL:
                  return 0x0000000F; // Modest; genderless Levitate line.
              case SPECIES_MAGNEMITE:
              case SPECIES_MAGNETON:
                  return 0x00000028; // Modest, ability slot 0 (Magnet Pull).
              case SPECIES_BAGON:
              case SPECIES_SALAMENCE:
                  return 0x000021FF; // Adamant, male; same Bagon-line identity.
              default:
                  return fallbackPersonality;
              }
          }

          static void ApplyThomasTrainerMonOverrides(u16 trainerNum, u16 species, struct Pokemon *mon)
          {
              if (IsThomasTrainer(trainerNum) && species == SPECIES_SALAMENCE)
              {
                  u8 friendship = 0;
                  SetMonData(mon, MON_DATA_FRIENDSHIP, &friendship);
              }
          }

          '''
          if function_anchor not in text:
              raise SystemExit("CreateNPCTrainerParty function anchor not found")
          text = text.replace(function_anchor, helpers + function_anchor, 1)

          custom_no_item_old = '''                personalityValue += nameHash << 8;
                fixedIV = partyData[i].iv * MAX_PER_STAT_IVS / 255;
                CreateMon(&party[i], partyData[i].species, partyData[i].lvl, fixedIV, TRUE, personalityValue, OT_ID_RANDOM_NO_SHINY, 0);

                for (j = 0; j < MAX_MON_MOVES; j++)
'''
          custom_no_item_new = '''                personalityValue += nameHash << 8;
                personalityValue = GetThomasTrainerMonPersonality(trainerNum, partyData[i].species, personalityValue);
                fixedIV = partyData[i].iv * MAX_PER_STAT_IVS / 255;
                CreateMon(&party[i], partyData[i].species, partyData[i].lvl, fixedIV, TRUE, personalityValue, OT_ID_RANDOM_NO_SHINY, 0);
                ApplyThomasTrainerMonOverrides(trainerNum, partyData[i].species, &party[i]);

                for (j = 0; j < MAX_MON_MOVES; j++)
'''
          if custom_no_item_old not in text:
              raise SystemExit("No-item custom-moves block not found")
          text = text.replace(custom_no_item_old, custom_no_item_new, 1)

          custom_item_old = '''                personalityValue += nameHash << 8;
                fixedIV = partyData[i].iv * MAX_PER_STAT_IVS / 255;
                CreateMon(&party[i], partyData[i].species, partyData[i].lvl, fixedIV, TRUE, personalityValue, OT_ID_RANDOM_NO_SHINY, 0);
                SetMonData(&party[i], MON_DATA_HELD_ITEM, &partyData[i].heldItem);

                for (j = 0; j < MAX_MON_MOVES; j++)
'''
          custom_item_new = '''                personalityValue += nameHash << 8;
                personalityValue = GetThomasTrainerMonPersonality(trainerNum, partyData[i].species, personalityValue);
                fixedIV = partyData[i].iv * MAX_PER_STAT_IVS / 255;
                CreateMon(&party[i], partyData[i].species, partyData[i].lvl, fixedIV, TRUE, personalityValue, OT_ID_RANDOM_NO_SHINY, 0);
                ApplyThomasTrainerMonOverrides(trainerNum, partyData[i].species, &party[i]);
                SetMonData(&party[i], MON_DATA_HELD_ITEM, &partyData[i].heldItem);

                for (j = 0; j < MAX_MON_MOVES; j++)
'''
          if custom_item_old not in text:
              raise SystemExit("Held-item custom-moves block not found")
          text = text.replace(custom_item_old, custom_item_new, 1)

          path.write_text(text)

      - name: Restore normal workflow and commit source delta
        run: |
          git checkout HEAD^ -- .github/workflows/build.yml
          git config user.name "InternetNinjacy"
          git config user.email "45226145+InternetNinjacy@users.noreply.github.com"
          git add src/battle_main.c .github/workflows/build.yml
          git commit -m "THOMAS: lock persistent rival party characteristics"
          git push origin HEAD:sam/thomas-chunk4-persistent-characteristics
