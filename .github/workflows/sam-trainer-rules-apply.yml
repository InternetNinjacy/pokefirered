name: Sam trainer rules application

on:
  push:
    branches:
      - sam/trainer-rules-application

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sam/trainer-rules-application

      - name: Apply trainer naming contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          trainers_path = Path('src/data/trainers.h')
          text = trainers_path.read_text()

          # Current Sam Edition Gym specialties. These labels are used only to
          # choose display-name puns; trainer IDs, parties, maps, flags, scripts,
          # classes, dialogue, and battle state are deliberately untouched.
          gym_specs = {
              'PewterCity_Gym': ('ICE', ['FROST', 'CRYSTAL', 'COLE', 'NEVA', 'EIRA', 'WINTER', 'JACK', 'HOLLY']),
              'CeruleanCity_Gym': ('FIRE', ['ASH', 'BLAISE', 'EMBER', 'CINDER', 'COLE', 'IGNACIO', 'FLINT', 'PHOEBE']),
              'VermilionCity_Gym': ('WATER', ['WADE', 'BROOKE', 'MARINA', 'RIVER', 'PEARL', 'FINN', 'CORAL', 'DELTA']),
              'CeladonCity_Gym': ('BUG', ['BEA', 'ANTONIA', 'WEBB', 'MIDGE', 'FLYNN', 'CRICKET', 'ARACHNE', 'BEETRICE']),
              'FuchsiaCity_Gym': ('NORMAL', ['NORM', 'NORMA', 'GENE', 'AVERY', 'BASIC', 'PLAIN', 'STAN', 'ORDIN']),
              'SaffronCity_Gym': ('GRASS', ['IVY', 'FERN', 'ROSE', 'BASIL', 'REED', 'FLORA', 'SAGE', 'LAUREL']),
              'CinnabarIsland_Gym': ('GHOST', ['MORT', 'SPIRA', 'CASPER', 'PHANTOM', 'HAUNTLY', 'SPECTRA', 'WRAITH', 'GHOULIA']),
              'ViridianCity_Gym': ('DRAGON', ['DRAKE', 'RYU', 'DRACO', 'WYVERN', 'DRAKEON', 'SCALA', 'TALON', 'DRAKON']),
          }

          # Cooltrainer variants deliberately use readable "tragedeigh" names.
          cool_m = [
              'JAYSYNN','BRAEDYN','DYLHAAN','TREIVOR','KHAEDEN','ZAYVIER',
              'JAXSYN','RYLEIGH','KOLBYN','AUSTYNN','MYKHAEL','JORDYNN',
              'KAMRYN','BENTLEE','TYLUR','KONNOR','BRENDYN','GRAYCEN',
              'KAYSON','TRYSTYN','BRAYLON','JAXXON','KAELUM','RYDERR',
          ]
          cool_f = [
              'ASHLEIGH','KHAETLYN','MEIGHGAN','KALEIGH','JESSYKAH','BRYTNEE',
              'EMYLEIGH','MACKYNZIE','KHLOEE','MADYSYN','RAYCHEL','ALYXXA',
              'KAROLYNN','SHANNYN','KAYDYNCE','MAKENNAH','AUBREE','PAISLEE',
              'ADDYSYN','KYNZLEE','BRAELYN','JAZMYNN','KASSYDEE','RYLEEIGH',
          ]
          gym_cool = {
              'ICE': ['KRYSTYL','FROSTEIGH','WYNTR','NEVAEH'],
              'FIRE': ['BLAEZE','EMBYR','SYNDYR','ASHLEIGH'],
              'WATER': ['RAYNE','BROOKLYN','MAERYN','RIVYRR'],
              'BUG': ['BEEIGH','ANTONIE','FLYNN','MYDGE'],
              'NORMAL': ['NORMYNN','AVEREIGH','GENERYK','PLAEYN'],
              'GRASS': ['IVEIGH','FERYN','ROZLYN','SAEJ'],
              'GHOST': ['MORTEIGH','SPYRIT','GHASTYN','SPEKTRA'],
              'DRAGON': ['DRAYKE','RYUU','DRAEKON','WYVRYN'],
          }

          # Collect trainer IDs referenced by each Gym map. This means an
          # already-merged Gym remains bound to exactly the same trainer records.
          gym_ids = {}
          trainer_to_gym = {}
          for map_name in gym_specs:
              p = Path('data/maps') / map_name / 'scripts.inc'
              if not p.exists():
                  continue
              ids = []
              seen = set()
              for tid in re.findall(r'\b(TRAINER_[A-Z0-9_]+)\b', p.read_text()):
                  if tid not in seen:
                      seen.add(tid)
                      ids.append(tid)
                      trainer_to_gym.setdefault(tid, map_name)
              gym_ids[map_name] = ids

          record_re = re.compile(r'(?ms)^    \[(TRAINER_[A-Z0-9_]+)\] = \{\n(.*?)^    \},')
          matches = list(record_re.finditer(text))
          records = {m.group(1): m for m in matches}

          def field(block, name):
              m = re.search(rf'\.{name}\s*=\s*([^,\n]+)', block)
              return m.group(1).strip() if m else ''

          def old_name(block):
              m = re.search(r'\.trainerName\s*=\s*_\("([^"]*)"\)', block)
              return m.group(1) if m else None

          def set_name(block, new_name):
              if len(new_name) > 10:
                  raise SystemExit(f'trainer display name too long: {new_name}')
              return re.sub(
                  r'(\.trainerName\s*=\s*_\(")[^"]*("\))',
                  lambda m: m.group(1) + new_name + m.group(2),
                  block,
                  count=1,
              )

          major_tokens = (
              'LEADER','RIVAL','CHAMPION','ELITE','SATOSHI','THOMAS','GIOVANNI',
              'BROCK','LEILANI','MISTY','LT_SURGE','ERIKA','KOGA','SABRINA','BLAINE',
              'LORELEI','AGATHA','LANCE','BLUE','GREEN',
          )

          changes = {}

          # Gym trainer display names: type pun is primary. Cooltrainers get
          # the type pun in deliberately trendy spelling where possible.
          for map_name, ids in gym_ids.items():
              theme, normal_pool = gym_specs[map_name]
              normal_i = 0
              cool_i = 0
              for tid in ids:
                  m = records.get(tid)
                  if not m:
                      continue
                  block = m.group(2)
                  trainer_class = field(block, 'trainerClass')
                  if any(tok in tid for tok in major_tokens) or 'LEADER' in trainer_class:
                      continue
                  current = old_name(block)
                  if current is None:
                      continue
                  is_cool = 'COOLTRAINER' in trainer_class or 'COOLTRAINER' in tid
                  if is_cool:
                      pool = gym_cool[theme]
                      new = pool[cool_i % len(pool)]
                      cool_i += 1
                  else:
                      new = normal_pool[normal_i % len(normal_pool)]
                      normal_i += 1
                  if current != new:
                      changes[tid] = new

          # Non-Gym Cooltrainers: replace ordinary names with cursed/trendy
          # spellings. Preserve repeated/rematch variants as the same person.
          male_map = {}
          female_map = {}
          mi = fi = 0
          for m in matches:
              tid, block = m.group(1), m.group(2)
              trainer_class = field(block, 'trainerClass')
              if 'COOLTRAINER' not in trainer_class and 'COOLTRAINER' not in tid:
                  continue
              if tid in trainer_to_gym or any(tok in tid for tok in major_tokens):
                  continue
              current = old_name(block)
              if not current:
                  continue
              base = re.sub(r'_\d+$', '', tid)
              female = 'F_TRAINER_FEMALE' in block or 'COOLTRAINER_F' in field(block, 'trainerPic')
              if female:
                  if base not in female_map:
                      female_map[base] = cool_f[fi % len(cool_f)]
                      fi += 1
                  new = female_map[base]
              else:
                  if base not in male_map:
                      male_map[base] = cool_m[mi % len(cool_m)]
                      mi += 1
                  new = male_map[base]
              if current != new:
                  changes[tid] = new

          # Apply replacements record-by-record without changing any record key,
          # class, party, AI, bag item, Double Battle flag, or script binding.
          out = []
          pos = 0
          for m in matches:
              out.append(text[pos:m.start()])
              tid, block = m.group(1), m.group(2)
              if tid in changes:
                  block = set_name(block, changes[tid])
              out.append(f'    [{tid}] = {{\n{block}    }},')
              pos = m.end()
          out.append(text[pos:])
          trainers_path.write_text(''.join(out))

          # Record the governing construction rules in-source so future trainer
          # passes do not have to infer them from old roadmaps or chat history.
          doc = Path('docs/sam_edition/TRAINER_CONSTRUCTION_RULES.md')
          doc.parent.mkdir(parents=True, exist_ok=True)
          doc.write_text('''# Pokémon: Sam Edition — Trainer Construction Rules\n\nCurrent explicit trainer-data authority. These rules govern ordinary trainer cleanup without reopening already-authored major battles or Gym scripts.\n\n## Ordinary trainers\n- Build a coherent moveset from moves the Pokémon can reasonably know by its current level.\n- Do not grant TM or HM moves.\n- Do not grant held items unless the Pokémon naturally carries that item under the current Sam species/encounter rules.\n- A coherent level-up set may retain useful earlier level-up moves rather than blindly using the four most recent moves.\n\n## Cooltrainers\n- Follow the ordinary-trainer baseline, except a Cooltrainer may use HM moves that are reasonable for the player's current point in progression.\n- Non-Gym Cooltrainers use intentionally over-stylized / “tragedeigh” spellings of recognizable human names.\n\n## Gym trainers\n- Preserve the existing Gym's authored trainer IDs, party bindings, scripts, flags, dialogue, and map choreography.\n- A Gym trainer may use that Gym's awarded TM on a compatible Pokémon.\n- Gym trainer display names are puns related to the Gym's current specialty.\n- If a Gym trainer is also a Cooltrainer, the type-pun rule takes priority and may use a trendy spelling.\n\n## Scientists\n- Scientist Pokémon tend to hold evolution items where appropriate to the team concept. This is a tendency rather than a requirement that every Scientist Pokémon hold an item.\n\n## Dialogue\n- Preserve ordinary trainer dialogue by default.\n- Rewrite ordinary trainer dialogue only when that trainer's overworld sprite/presentation was changed and the old dialogue no longer fits.\n- Preserve already-authored Gym trainer dialogue; changing a display name alone does not reopen Gym dialogue.\n- Major/story-character dialogue remains controlled by that character's specialist authority.\n\n## Major authored battles\nRivals, Gym Leaders, Elite Four, Team Rocket bosses, Satoshi, Thomas, and other specifically authored story encounters are not normalized by these ordinary-trainer rules. Their specialist battle packages remain controlling.\n''')

          print(f'updated {len(changes)} trainer display names')
          for tid, name in sorted(changes.items()):
              print(f'{tid} -> {name}')
          PY

          # The helper is not production content. Remove it in the same
          # source-application commit so the final PR contains only game data + authority.
          rm -f .github/workflows/sam-trainer-rules-apply.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trainers.h docs/sam_edition/TRAINER_CONSTRUCTION_RULES.md .github/workflows/sam-trainer-rules-apply.yml
          git commit -m "Apply Sam trainer naming and construction rules"
          git push origin HEAD:sam/trainer-rules-application
