name: TITLE-001-003 Runtime QA

on:
  push:
    branches: [qa/title-001-003-runtime]
  workflow_dispatch:

jobs:
  title-runtime-qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/title-001-003-runtime
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi git libpng-dev mgba-sdl xvfb xdotool imagemagick

      - name: Build agbcc
        run: |
          set -euxo pipefail
          cd ..
          git clone --depth 1 https://github.com/pret/agbcc.git
          cd agbcc
          ./build.sh
          ./install.sh ../pokefirered

      - name: Verify production payload
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          prod = '22f7f806b8016832b0be1d9580d2432dc7cef29c'
          files = [
              'src/title_screen.c',
              'graphics/title_screen/sam/title_screen.gbapal',
              'graphics/title_screen/sam/title_screen_part0.4bpp',
              'graphics/title_screen/sam/title_screen_part1.4bpp',
              'graphics/title_screen/sam/title_screen_part2.4bpp',
              'graphics/title_screen/sam/title_screen_part3.4bpp',
          ]
          subprocess.check_call(['git','merge-base','--is-ancestor',prod,'HEAD'])
          subprocess.check_call(['git','diff','--exit-code',prod,'HEAD','--',*files])
          sizes = [32,4800,4800,4800,4798]
          for path,size in zip(files[1:],sizes):
              assert Path(path).stat().st_size == size, (path,Path(path).stat().st_size)
          text = Path('src/title_screen.c').read_text()
          for token in [
              'LoadSamTitleScreen();',
              'sSamTitleScreen_TilesTail[] = { 0xDE, 0xDD };',
              'CpuCopy16(sSamTitleScreen_TilesTail, (void *)(VRAM + 0x4AFE)',
              'JOY_NEW(A_BUTTON | START_BUTTON)',
              '#define KEYSTROKE_DELSAVE (B_BUTTON | SELECT_BUTTON | DPAD_UP)',
              'SetMainCallback2(CB2_InitMainMenu);',
              'SetMainCallback2(CB2_InitCopyrightScreenAfterTitleScreen);',
          ]:
              assert token in text, token
          assert 'PlayCry_Normal(TITLE_SPECIES' not in text
          print('TITLE QA STATIC PASS exact production payload semantics')
          PY

      - name: Reconstruct native title
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          pal = Path('graphics/title_screen/sam/title_screen.gbapal').read_bytes()
          raw = b''.join(Path(f'graphics/title_screen/sam/title_screen_part{i}.4bpp').read_bytes() for i in range(4)) + bytes([0xDE,0xDD])
          assert len(pal) == 32 and len(raw) == 19200
          colors=[]
          for i in range(16):
              v=struct.unpack_from('<H',pal,i*2)[0]
              colors.append(((v&31)*255//31,((v>>5)&31)*255//31,((v>>10)&31)*255//31))
          px=bytearray(240*160*3)
          for tile in range(600):
              tx,ty=tile%30,tile//30
              off=tile*32
              for y in range(8):
                  for xb in range(4):
                      b=raw[off+y*4+xb]
                      for sub,idx in enumerate((b&15,b>>4)):
                          x=tx*8+xb*2+sub; yy=ty*8+y; p=(yy*240+x)*3
                          px[p:p+3]=bytes(colors[idx])
          with open('title_native_exact.ppm','wb') as f:
              f.write(b'P6\n240 160\n255\n'); f.write(px)
          print('TITLE QA NATIVE PASS')
          PY
          convert title_native_exact.ppm title_native_exact.png
          test "$(identify -format '%wx%h' title_native_exact.png)" = "240x160"
          test "$(convert title_native_exact.png -format %k info:)" -le 16

      - name: Inject QA runtime markers
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/title_screen.c')
          text=p.read_text()
          text=text.replace('#include "global.h"\n','#include "global.h"\n#include "gba/isagbprint.h"\n',1)
          anchor='static const u8 sSamTitleScreen_TilesTail[] = { 0xDE, 0xDD };\n'
          helper=''.join([
              '\n#define TITLE_QA_MGBA_ENABLE ((vu16 *)0x4FFF780)\n',
              '#define TITLE_QA_MGBA_FLAGS ((vu16 *)0x4FFF700)\n',
              '#define TITLE_QA_MGBA_STRING ((volatile char *)0x4FFF600)\n',
              'static void TitleQaLog(const char *text)\n{\n',
              '    u32 i = 0;\n',
              '    *TITLE_QA_MGBA_ENABLE = 0xC0DE;\n',
              "    while (text[i] != '\\0' && i < 255)\n    {\n",
              '        TITLE_QA_MGBA_STRING[i] = text[i];\n        i++;\n    }\n',
              "    TITLE_QA_MGBA_STRING[i] = '\\0';\n",
              '    *TITLE_QA_MGBA_FLAGS = MGBA_LOG_INFO | 0x100;\n}\n'
          ])
          assert anchor in text
          text=text.replace(anchor,anchor+helper,1)
          reps=[
              ('        HelpSystem_Enable();\n        tState++;','        HelpSystem_Enable();\n        TitleQaLog("TITLEQA RUN");\n        tState++;'),
              ('            SetMainCallback2(CB2_FadeOutTransitionToSaveClearScreen);','            TitleQaLog("TITLEQA SAVECLEAR");\n            SetMainCallback2(CB2_FadeOutTransitionToSaveClearScreen);'),
              ('            SetTitleScreenScene(data, TITLESCREENSCENE_CRY);','            TitleQaLog("TITLEQA INPUT ACCEPTED");\n            SetTitleScreenScene(data, TITLESCREENSCENE_CRY);'),
              ('            SetTitleScreenScene(data, TITLESCREENSCENE_RESTART);','            TitleQaLog("TITLEQA TIMEOUT");\n            SetTitleScreenScene(data, TITLESCREENSCENE_RESTART);'),
              ('            SetMainCallback2(CB2_InitCopyrightScreenAfterTitleScreen);','            TitleQaLog("TITLEQA RESTART");\n            SetMainCallback2(CB2_InitCopyrightScreenAfterTitleScreen);'),
              ('            SetMainCallback2(CB2_InitMainMenu);','            TitleQaLog("TITLEQA MAINMENU NOCRY");\n            SetMainCallback2(CB2_InitMainMenu);'),
          ]
          for old,new in reps:
              assert text.count(old)==1,(old,text.count(old))
              text=text.replace(old,new,1)
          p.write_text(text)
          PY

      - name: Build QA ROM
        run: |
          set -euxo pipefail
          make -j2
          test -f pokefirered.gba
          sha1sum pokefirered.gba | tee TITLE_QA_ROM_SHA1.txt
          git rev-parse HEAD | tee TITLE_QA_SOURCE_SHA.txt
          echo 22f7f806b8016832b0be1d9580d2432dc7cef29c > TITLE_PRODUCTION_SOURCE_SHA.txt

      - name: Runtime START and A
        run: |
          set -euxo pipefail
          run_test() {
            DISP="$1"; KEY="$2"; P="$3"
            export DISPLAY="$DISP" SDL_VIDEODRIVER=x11
            Xvfb "$DISP" -screen 0 960x640x24 > "${P}_xvfb.log" 2>&1 & XP=$!
            sleep 2
            mgba pokefirered.gba > "${P}.log" 2>&1 & MP=$!
            for i in $(seq 1 90); do grep -q 'TITLEQA RUN' "${P}.log" && break; sleep 1; done
            grep -q 'TITLEQA RUN' "${P}.log"
            W=$(xdotool search --onlyvisible --class mgba 2>/dev/null | tail -n1)
            test -n "$W"
            xdotool key --window "$W" "$KEY"
            for i in $(seq 1 25); do grep -q 'TITLEQA MAINMENU NOCRY' "${P}.log" && break; sleep 1; done
            grep -q 'TITLEQA INPUT ACCEPTED' "${P}.log"
            grep -q 'TITLEQA MAINMENU NOCRY' "${P}.log"
            kill "$MP" || true; kill "$XP" || true
          }
          run_test :99 Return title_start
          run_test :98 x title_a
          echo 'TITLE QA START/A PASS'

      - name: Runtime save-clear
        run: |
          set -euxo pipefail
          export DISPLAY=:97 SDL_VIDEODRIVER=x11
          Xvfb :97 -screen 0 960x640x24 > saveclear_xvfb.log 2>&1 & XP=$!
          sleep 2
          mgba pokefirered.gba > title_saveclear.log 2>&1 & MP=$!
          for i in $(seq 1 90); do grep -q 'TITLEQA RUN' title_saveclear.log && break; sleep 1; done
          W=$(xdotool search --onlyvisible --class mgba 2>/dev/null | tail -n1)
          test -n "$W"
          xdotool keydown --window "$W" z
          xdotool keydown --window "$W" BackSpace
          xdotool keydown --window "$W" Up
          sleep 1
          xdotool keyup --window "$W" Up
          xdotool keyup --window "$W" BackSpace
          xdotool keyup --window "$W" z
          for i in $(seq 1 25); do grep -q 'TITLEQA SAVECLEAR' title_saveclear.log && break; sleep 1; done
          grep -q 'TITLEQA SAVECLEAR' title_saveclear.log
          kill "$MP" || true; kill "$XP" || true
          echo 'TITLE QA SAVECLEAR PASS'

      - name: Runtime timeout restart
        run: |
          set -euxo pipefail
          export DISPLAY=:96 SDL_VIDEODRIVER=x11
          Xvfb :96 -screen 0 960x640x24 > timeout_xvfb.log 2>&1 & XP=$!
          sleep 2
          mgba pokefirered.gba > title_timeout.log 2>&1 & MP=$!
          for i in $(seq 1 90); do grep -q 'TITLEQA RUN' title_timeout.log && break; sleep 1; done
          for i in $(seq 1 80); do grep -q 'TITLEQA RESTART' title_timeout.log && break; sleep 1; done
          grep -q 'TITLEQA TIMEOUT' title_timeout.log
          grep -q 'TITLEQA RESTART' title_timeout.log
          kill "$MP" || true; kill "$XP" || true
          echo 'TITLE QA TIMEOUT PASS'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: title-001-003-runtime-qa
          path: |
            pokefirered.gba
            TITLE_QA_ROM_SHA1.txt
            TITLE_QA_SOURCE_SHA.txt
            TITLE_PRODUCTION_SOURCE_SHA.txt
            title_native_exact.png
            title_start.log
            title_a.log
            title_saveclear.log
            title_timeout.log
          if-no-files-found: warn
