name: Blue Chunk 2 Safe Hookups

on:
  push:
    branches:
      - sam/blue-chunk2-encounter-hookup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sam/blue-chunk2-encounter-hookup
          fetch-depth: 0
      - name: Apply inherited Blue branch routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('data/maps/Route22/scripts.inc'),
              Path('data/maps/PokemonTower_2F/scripts.inc'),
              Path('data/maps/SilphCo_7F/scripts.inc'),
          ]

          mappings = {
              files[0]: (
                  '\tcall_if_eq VAR_STARTER_MON, 2, Route22_EventScript_EarlyRivalSquirtle\n\tcall_if_eq VAR_STARTER_MON, 1, Route22_EventScript_EarlyRivalBulbasaur\n\tcall_if_eq VAR_STARTER_MON, 0, Route22_EventScript_EarlyRivalCharmander',
                  '\tcall_if_eq VAR_STARTER_MON, 0, Route22_EventScript_EarlyRivalSquirtle\n\tcall_if_eq VAR_STARTER_MON, 1, Route22_EventScript_EarlyRivalCharmander\n\tcall_if_eq VAR_STARTER_MON, 2, Route22_EventScript_EarlyRivalBulbasaur'
              ),
              files[1]: (
                  '\tcall_if_eq VAR_STARTER_MON, 2, PokemonTower_2F_EventScript_RivalSquirtle\n\tcall_if_eq VAR_STARTER_MON, 1, PokemonTower_2F_EventScript_RivalBulbasaur\n\tcall_if_eq VAR_STARTER_MON, 0, PokemonTower_2F_EventScript_RivalCharmander',
                  '\tcall_if_eq VAR_STARTER_MON, 0, PokemonTower_2F_EventScript_RivalSquirtle\n\tcall_if_eq VAR_STARTER_MON, 1, PokemonTower_2F_EventScript_RivalCharmander\n\tcall_if_eq VAR_STARTER_MON, 2, PokemonTower_2F_EventScript_RivalBulbasaur'
              ),
              files[2]: (
                  '\tcall_if_eq VAR_STARTER_MON, 2, SilphCo_7F_EventScript_RivalSquirtle\n\tcall_if_eq VAR_STARTER_MON, 1, SilphCo_7F_EventScript_RivalBulbasaur\n\tcall_if_eq VAR_STARTER_MON, 0, SilphCo_7F_EventScript_RivalCharmander',
                  '\tcall_if_eq VAR_STARTER_MON, 0, SilphCo_7F_EventScript_RivalSquirtle\n\tcall_if_eq VAR_STARTER_MON, 1, SilphCo_7F_EventScript_RivalCharmander\n\tcall_if_eq VAR_STARTER_MON, 2, SilphCo_7F_EventScript_RivalBulbasaur'
              ),
          }

          for path, (old, new) in mappings.items():
              text = path.read_text()
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'missing expected branch router in {path}')
              path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/blue-chunk2-safe-hookups.yml
          git add data/maps/Route22/scripts.inc data/maps/PokemonTower_2F/scripts.inc data/maps/SilphCo_7F/scripts.inc
          git commit -m "Blue Chunk 2: route inherited rival scenes through Sam starter mapping"
          git push origin HEAD:sam/blue-chunk2-encounter-hookup
