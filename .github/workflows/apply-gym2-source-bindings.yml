name: Apply Gym2 source bindings
on:
  push:
    branches:
      - sam/gym2-cerulean-reconcile-existing
    paths:
      - .github/workflows/apply-gym2-source-bindings.yml
permissions:
  contents: write
jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bind recovered Cerulean source assets and trainer data
        shell: bash
        run: |
          set -euo pipefail
          cat > src/data/sam_gym2_cerulean_graphics.h <<'EOF'
          #ifndef GUARD_DATA_SAM_GYM2_CERULEAN_GRAPHICS_H
          #define GUARD_DATA_SAM_GYM2_CERULEAN_GRAPHICS_H

          const u32 gTrainerFrontPic_Leilani[] = INCBIN_U32("graphics/trainers/front_pics/leilani_front_pic.4bpp.lz");
          const u16 gTrainerPalette_Leilani[] = INCBIN_U16("graphics/trainers/palettes/leilani.gbapal");
          const u32 gTrainerFrontPic_Lehua[] = INCBIN_U32("graphics/trainers/front_pics/lehua_front_pic.4bpp.lz");
          const u16 gTrainerPalette_Lehua[] = INCBIN_U16("graphics/trainers/palettes/lehua.gbapal");
          const u32 gTrainerFrontPic_Keahi[] = INCBIN_U32("graphics/trainers/front_pics/keahi_front_pic.4bpp.lz");
          const u16 gTrainerPalette_Keahi[] = INCBIN_U16("graphics/trainers/palettes/keahi.gbapal");

          #endif
          EOF

          cat > src/data/sam_gym2_cerulean_parties.h <<'EOF'
          #ifndef GUARD_DATA_SAM_GYM2_CERULEAN_PARTIES_H
          #define GUARD_DATA_SAM_GYM2_CERULEAN_PARTIES_H

          static const struct TrainerMonNoItemCustomMoves sParty_FireDancerLehua[] = {
              {.iv = 60, .lvl = 18, .species = SPECIES_GROWLITHE, .moves = {MOVE_EMBER, MOVE_BITE, MOVE_LEER, MOVE_ROAR}},
              {.iv = 60, .lvl = 19, .species = SPECIES_PONYTA, .moves = {MOVE_EMBER, MOVE_STOMP, MOVE_TAIL_WHIP, MOVE_AGILITY}},
          };

          static const struct TrainerMonNoItemCustomMoves sParty_FireDancerKeahi[] = {
              {.iv = 60, .lvl = 19, .species = SPECIES_VULPIX, .moves = {MOVE_EMBER, MOVE_CONFUSE_RAY, MOVE_TAIL_WHIP, MOVE_QUICK_ATTACK}},
              {.iv = 60, .lvl = 20, .species = SPECIES_CHARMELEON, .moves = {MOVE_EMBER, MOVE_METAL_CLAW, MOVE_SMOKESCREEN, MOVE_SCRATCH}},
          };

          static const struct TrainerMonNoItemCustomMoves sParty_LeaderLeilani[] = {
              {.iv = 100, .lvl = 20, .species = SPECIES_FLAREON, .moves = {MOVE_EMBER, MOVE_QUICK_ATTACK, MOVE_SAND_ATTACK, MOVE_TAIL_WHIP}},
              {.iv = 100, .lvl = 21, .species = SPECIES_MAGMAR, .moves = {MOVE_EMBER, MOVE_SMOKESCREEN, MOVE_LEER, MOVE_KARATE_CHOP}},
              {.iv = 100, .lvl = 22, .species = SPECIES_NINETALES, .moves = {MOVE_EMBER, MOVE_CONFUSE_RAY, MOVE_QUICK_ATTACK, MOVE_WILL_O_WISP}},
          };

          static const struct TrainerMonItemCustomMoves sParty_LeaderLeilaniRematch[] = {
              {.iv = 255, .lvl = 59, .species = SPECIES_FLAREON,   .heldItem = ITEM_CHARCOAL,    .moves = {MOVE_FLAMETHROWER, MOVE_SHADOW_BALL, MOVE_QUICK_ATTACK, MOVE_WILL_O_WISP}},
              {.iv = 255, .lvl = 60, .species = SPECIES_MAGMAR,    .heldItem = ITEM_MAGNET,      .moves = {MOVE_FLAMETHROWER, MOVE_THUNDER_PUNCH, MOVE_PSYCHIC, MOVE_CONFUSE_RAY}},
              {.iv = 255, .lvl = 61, .species = SPECIES_CAMERUPT,  .heldItem = ITEM_QUICK_CLAW,  .moves = {MOVE_ERUPTION, MOVE_EARTHQUAKE, MOVE_ROCK_SLIDE, MOVE_FLAMETHROWER}},
              {.iv = 255, .lvl = 62, .species = SPECIES_CHARIZARD, .heldItem = ITEM_SHARP_BEAK,  .moves = {MOVE_FLAMETHROWER, MOVE_AERIAL_ACE, MOVE_BRICK_BREAK, MOVE_DRAGON_CLAW}},
              {.iv = 255, .lvl = 63, .species = SPECIES_BLAZIKEN,  .heldItem = ITEM_BLACK_BELT,  .moves = {MOVE_BLAZE_KICK, MOVE_SKY_UPPERCUT, MOVE_ROCK_SLIDE, MOVE_BULK_UP}},
              {.iv = 255, .lvl = 64, .species = SPECIES_NINETALES, .heldItem = ITEM_LEFTOVERS,   .moves = {MOVE_FLAMETHROWER, MOVE_WILL_O_WISP, MOVE_CONFUSE_RAY, MOVE_SUNNY_DAY}},
          };

          #endif
          EOF

          cat > src/data/sam_gym2_cerulean_object_graphics.h <<'EOF'
          #ifndef GUARD_DATA_SAM_GYM2_CERULEAN_OBJECT_GRAPHICS_H
          #define GUARD_DATA_SAM_GYM2_CERULEAN_OBJECT_GRAPHICS_H

          const u32 gObjectEventPic_Leilani[] = INCBIN_U32("graphics/object_events/pics/people/leilani.4bpp");
          const u16 gObjectEventPal_Leilani[] = INCBIN_U16("graphics/object_events/palettes/leilani.gbapal");
          const u32 gObjectEventPic_Lehua[] = INCBIN_U32("graphics/object_events/pics/people/lehua.4bpp");
          const u16 gObjectEventPal_Lehua[] = INCBIN_U16("graphics/object_events/palettes/lehua.gbapal");
          const u32 gObjectEventPic_Keahi[] = INCBIN_U32("graphics/object_events/pics/people/keahi.4bpp");
          const u16 gObjectEventPal_Keahi[] = INCBIN_U16("graphics/object_events/palettes/keahi.gbapal");

          static const struct SpriteFrameImage sPicTable_Leilani[] = {
              overworld_frame(gObjectEventPic_Leilani, 2, 4, 0),
              overworld_frame(gObjectEventPic_Leilani, 2, 4, 1),
              overworld_frame(gObjectEventPic_Leilani, 2, 4, 2),
              overworld_frame(gObjectEventPic_Leilani, 2, 4, 3),
          };
          static const struct SpriteFrameImage sPicTable_Lehua[] = {
              overworld_frame(gObjectEventPic_Lehua, 2, 4, 0),
              overworld_frame(gObjectEventPic_Lehua, 2, 4, 1),
              overworld_frame(gObjectEventPic_Lehua, 2, 4, 2),
              overworld_frame(gObjectEventPic_Lehua, 2, 4, 3),
          };
          static const struct SpriteFrameImage sPicTable_Keahi[] = {
              overworld_frame(gObjectEventPic_Keahi, 2, 4, 0),
              overworld_frame(gObjectEventPic_Keahi, 2, 4, 1),
              overworld_frame(gObjectEventPic_Keahi, 2, 4, 2),
              overworld_frame(gObjectEventPic_Keahi, 2, 4, 3),
          };

          static const union AnimCmd sAnim_Stationary4FacingSouth[] = {ANIMCMD_FRAME(0, 16), ANIMCMD_JUMP(0)};
          static const union AnimCmd sAnim_Stationary4FacingNorth[] = {ANIMCMD_FRAME(1, 16), ANIMCMD_JUMP(0)};
          static const union AnimCmd sAnim_Stationary4FacingWest[]  = {ANIMCMD_FRAME(2, 16), ANIMCMD_JUMP(0)};
          static const union AnimCmd sAnim_Stationary4FacingEast[]  = {ANIMCMD_FRAME(3, 16), ANIMCMD_JUMP(0)};
          static const union AnimCmd *const sAnimTable_Stationary4Facing[] = {
              [ANIM_STD_FACE_SOUTH] = sAnim_Stationary4FacingSouth,
              [ANIM_STD_FACE_NORTH] = sAnim_Stationary4FacingNorth,
              [ANIM_STD_FACE_WEST] = sAnim_Stationary4FacingWest,
              [ANIM_STD_FACE_EAST] = sAnim_Stationary4FacingEast,
              [ANIM_STD_GO_SOUTH] = sAnim_Stationary4FacingSouth,
              [ANIM_STD_GO_NORTH] = sAnim_Stationary4FacingNorth,
              [ANIM_STD_GO_WEST] = sAnim_Stationary4FacingWest,
              [ANIM_STD_GO_EAST] = sAnim_Stationary4FacingEast,
          };

          #define SAM_GYM2_OBJECT_INFO(name, palTag, picTable) \
          const struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_##name = { \
              .tileTag = TAG_NONE, .paletteTag = palTag, .reflectionPaletteTag = OBJ_EVENT_PAL_TAG_NONE, \
              .size = 256, .width = 16, .height = 32, .paletteSlot = PALSLOT_NPC_4, \
              .shadowSize = SHADOW_SIZE_M, .inanimate = FALSE, .disableReflectionPaletteLoad = FALSE, \
              .tracks = TRACKS_FOOT, .oam = &gObjectEventBaseOam_16x32, \
              .subspriteTables = gObjectEventSpriteOamTables_16x32, .anims = sAnimTable_Stationary4Facing, \
              .images = picTable, .affineAnims = gDummySpriteAffineAnimTable, \
          }

          SAM_GYM2_OBJECT_INFO(Leilani, OBJ_EVENT_PAL_TAG_LEILANI, sPicTable_Leilani);
          SAM_GYM2_OBJECT_INFO(Lehua, OBJ_EVENT_PAL_TAG_LEHUA, sPicTable_Lehua);
          SAM_GYM2_OBJECT_INFO(Keahi, OBJ_EVENT_PAL_TAG_KEAHI, sPicTable_Keahi);
          #undef SAM_GYM2_OBJECT_INFO

          #endif
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); t=p.read_text()
              if old not in t:
                  raise SystemExit(f'missing expected text in {path}: {old[:80]}')
              p.write_text(t.replace(old,new,1))

          # Keep graphics definitions local to data.c; no global allocation changes.
          replace('src/data.c', '#include "data/trainer_graphics/front_pic_anims.h"', '#include "data/sam_gym2_cerulean_graphics.h"\n#include "data/trainer_graphics/front_pic_anims.h"')
          replace('src/data.c', '#include "data/sam_satoshi_cerulean_parties.h"', '#include "data/sam_satoshi_cerulean_parties.h"\n#include "data/sam_gym2_cerulean_parties.h"')

          fp=Path('src/data/trainer_graphics/front_pic_tables.h')
          t=fp.read_text()
          for c in ('LEILANI','LEHUA','KEAHI'):
              pretty=c.title()
              t=t.replace(f'TRAINER_SPRITE({c}, gTrainerFrontPic_ProfessorOak, 0x800)', f'TRAINER_SPRITE({c}, gTrainerFrontPic_{pretty}, 0x800)')
              t=t.replace(f'TRAINER_PAL({c}, gTrainerPalette_ProfessorOak)', f'TRAINER_PAL({c}, gTrainerPalette_{pretty})')
          fp.write_text(t)

          # Object-event palette tags 0x111C-0x111E are already used by current static encounter work.
          em=Path('src/event_object_movement.c'); t=em.read_text()
          anchor='#define OBJ_EVENT_PAL_TAG_NONE                        0x11FF'
          tags='#define OBJ_EVENT_PAL_TAG_LEILANI                     0x111F\n#define OBJ_EVENT_PAL_TAG_LEHUA                       0x1120\n#define OBJ_EVENT_PAL_TAG_KEAHI                       0x1121\n'
          if 'OBJ_EVENT_PAL_TAG_LEILANI' not in t:
              t=t.replace(anchor,tags+anchor,1)
          include_anchor='#include "data/object_events/object_event_subsprites.h"\n'
          if 'sam_gym2_cerulean_object_graphics.h' not in t:
              t=t.replace(include_anchor, include_anchor+'#include "data/sam_gym2_cerulean_object_graphics.h"\n',1)
          pal_anchor='    {},\n};\n\nstatic const u16 sPlayerReflectionPaletteTags[]'
          pal_lines='    {gObjectEventPal_Leilani,                 OBJ_EVENT_PAL_TAG_LEILANI},\n    {gObjectEventPal_Lehua,                   OBJ_EVENT_PAL_TAG_LEHUA},\n    {gObjectEventPal_Keahi,                   OBJ_EVENT_PAL_TAG_KEAHI},\n'
          if '{gObjectEventPal_Leilani,' not in t:
              t=t.replace(pal_anchor,pal_lines+pal_anchor,1)
          em.write_text(t)

          gp=Path('src/data/object_events/object_event_graphics_info_pointers.h'); t=gp.read_text()
          decl='const struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_Leilani;\nconst struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_Lehua;\nconst struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_Keahi;\n'
          table='const struct ObjectEventGraphicsInfo *const gObjectEventGraphicsInfoPointers'
          if 'gObjectEventGraphicsInfo_Leilani;' not in t:
              t=t.replace(table,decl+'\n'+table,1)
          for c in ('LEILANI','LEHUA','KEAHI'):
              pretty=c.title()
              t=t.replace(f'[OBJ_EVENT_GFX_{c}] = &gObjectEventGraphicsInfo_ProfOak,', f'[OBJ_EVENT_GFX_{c}] = &gObjectEventGraphicsInfo_{pretty},')
          gp.write_text(t)

          # Append only the four Gym-owned trainer records. Satoshi 744/752 remain from PR #165.
          tr=Path('src/data/trainers.h'); t=tr.read_text().rstrip()
          if '[TRAINER_FIRE_DANCER_LEHUA]' not in t:
              assert t.endswith('};')
              block=r'''
              [TRAINER_FIRE_DANCER_LEHUA] = {
                  .trainerClass = TRAINER_CLASS_FIRE_DANCER,
                  .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_FEMALE | F_TRAINER_FEMALE,
                  .trainerPic = TRAINER_PIC_LEHUA,
                  .trainerName = _("LEHUA"),
                  .items = {},
                  .doubleBattle = FALSE,
                  .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE,
                  .party = NO_ITEM_CUSTOM_MOVES(sParty_FireDancerLehua),
              },
              [TRAINER_FIRE_DANCER_KEAHI] = {
                  .trainerClass = TRAINER_CLASS_FIRE_DANCER,
                  .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_MALE,
                  .trainerPic = TRAINER_PIC_KEAHI,
                  .trainerName = _("KEAHI"),
                  .items = {},
                  .doubleBattle = FALSE,
                  .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE,
                  .party = NO_ITEM_CUSTOM_MOVES(sParty_FireDancerKeahi),
              },
              [TRAINER_LEADER_LEILANI] = {
                  .trainerClass = TRAINER_CLASS_LEADER,
                  .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_FEMALE | F_TRAINER_FEMALE,
                  .trainerPic = TRAINER_PIC_LEILANI,
                  .trainerName = _("LEILANI"),
                  .items = {},
                  .doubleBattle = FALSE,
                  .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE | AI_SCRIPT_TRY_TO_FAINT | AI_SCRIPT_CHECK_VIABILITY,
                  .party = NO_ITEM_CUSTOM_MOVES(sParty_LeaderLeilani),
              },
              [TRAINER_LEADER_LEILANI_REMATCH] = {
                  .trainerClass = TRAINER_CLASS_LEADER,
                  .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_FEMALE | F_TRAINER_FEMALE,
                  .trainerPic = TRAINER_PIC_LEILANI,
                  .trainerName = _("LEILANI"),
                  .items = {ITEM_FULL_RESTORE, ITEM_FULL_RESTORE},
                  .doubleBattle = FALSE,
                  .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE | AI_SCRIPT_TRY_TO_FAINT | AI_SCRIPT_CHECK_VIABILITY,
                  .party = ITEM_CUSTOM_MOVES(sParty_LeaderLeilaniRematch),
              },
              '''
              t=t[:-2]+block+'};\n'
              tr.write_text(t)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data.c src/data/trainers.h src/event_object_movement.c src/data/trainer_graphics/front_pic_tables.h src/data/object_events/object_event_graphics_info_pointers.h src/data/sam_gym2_cerulean_graphics.h src/data/sam_gym2_cerulean_parties.h src/data/sam_gym2_cerulean_object_graphics.h
          git commit -m "Gym2: bind recovered Cerulean trainers and character graphics"
          git push origin HEAD:sam/gym2-cerulean-reconcile-existing
