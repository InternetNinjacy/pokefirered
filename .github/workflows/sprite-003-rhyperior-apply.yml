name: SPRITE-003 Rhyperior production apply
on:
  push:
    branches: [sam/sprite-003-rhyperior-assets]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sam/sprite-003-rhyperior-assets
          fetch-depth: 0
      - name: Apply Rhyperior registrations
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              assert old in s, (path, old)
              p.write_text(s.replace(old,new,1))

          replace('src/data/pokemon_graphics/front_pic_table.h',
                  'SPECIES_SPRITE(RHYPERIOR, gMonFrontPic_CircledQuestionMark)',
                  'SPECIES_SPRITE(RHYPERIOR, gMonFrontPic_Rhyperior)')
          replace('src/data/pokemon_graphics/back_pic_table.h',
                  'SPECIES_SPRITE(RHYPERIOR, gMonBackPic_CircledQuestionMark)',
                  'SPECIES_SPRITE(RHYPERIOR, gMonBackPic_Rhyperior)')
          replace('src/data/pokemon_graphics/palette_table.h',
                  'SPECIES_PAL(RHYPERIOR, gMonPalette_CircledQuestionMark)',
                  'SPECIES_PAL(RHYPERIOR, gMonPalette_Rhyperior)')
          replace('src/data/pokemon_graphics/shiny_palette_table.h',
                  'SPECIES_SHINY_PAL(RHYPERIOR, gMonPalette_CircledQuestionMark)',
                  'SPECIES_SHINY_PAL(RHYPERIOR, gMonShinyPalette_Rhyperior)')
          replace('src/data/pokemon_graphics/footprint_table.h',
                  '[SPECIES_RHYPERIOR] = gMonFootprint_Bulbasaur',
                  '[SPECIES_RHYPERIOR] = gMonFootprint_Rhyperior')
          replace('src/pokemon_icon.c',
                  '[SPECIES_RHYPERIOR]   = gMonIcon_QuestionMark',
                  '[SPECIES_RHYPERIOR]   = gMonIcon_Rhyperior')

          p=Path('src/data/pokemon_graphics/front_pic_coordinates.h')
          s=p.read_text()
          marker='[SPECIES_RHYPERIOR] =\n    {\n        .size = MON_COORDS_SIZE(64, 64),\n        .y_offset = 0,\n    },'
          assert marker in s
          p.write_text(s.replace(marker, '[SPECIES_RHYPERIOR] =\n    {\n        .size = MON_COORDS_SIZE(64, 64),\n        .y_offset = 2,\n    },', 1))

          p=Path('include/graphics.h'); s=p.read_text()
          if 'gMonFrontPic_Rhyperior' not in s:
              anchor='extern const u8 gMonIcon_Ectoceon[];\n'
              assert anchor in s
              block=(anchor+
                     'extern const u32 gMonFrontPic_Rhyperior[];\n'
                     'extern const u32 gMonPalette_Rhyperior[];\n'
                     'extern const u32 gMonBackPic_Rhyperior[];\n'
                     'extern const u32 gMonShinyPalette_Rhyperior[];\n'
                     'extern const u8 gMonIcon_Rhyperior[];\n'
                     'extern const u8 gMonFootprint_Rhyperior[];\n')
              p.write_text(s.replace(anchor,block,1))

          # Preserve source-package icon palette index 0 and exact back coordinate metadata.
          icon=Path('src/pokemon_icon.c').read_text().split('const u8 gMonIconPaletteIndices[]',1)[1]
          assert '[SPECIES_RHYPERIOR]   = 0' in icon
          back=Path('src/data/pokemon_graphics/back_pic_coordinates.h').read_text().split('[SPECIES_RHYPERIOR] =',1)[1].split('[SPECIES_EGG]',1)[0]
          assert 'MON_COORDS_SIZE(64, 64)' in back and '.y_offset = 0' in back
          PY
          rm .github/workflows/sprite-003-rhyperior-apply.yml
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          timeout 300s sudo apt-get update
          timeout 900s sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi git libpng-dev
      - name: Build and install agbcc
        run: |
          set -euxo pipefail
          cd ..
          git clone https://github.com/pret/agbcc.git
          cd agbcc
          ./build.sh
          ./install.sh ../pokefirered
      - name: Build modified ROM
        run: |
          set -euxo pipefail
          make modern
          test -f pokefirered_modern.gba
      - name: Commit production packet
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SPRITE-003: integrate Rhyperior battle and UI assets'
          git push origin HEAD:sam/sprite-003-rhyperior-assets
