name: Blue Chunk 1 Production Fix

on:
  push:
    branches:
      - sam/blue-main-rival

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sam/blue-main-rival
          fetch-depth: 0
      - name: Correct Blue League IV hook placement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/battle_main.c')
          text = p.read_text()
          old = '''                break;\n            }\n\n            // Sam Edition Blue: force the authored Hidden Power Grass on League Manectric'''
          new = '''                break;\n            }\n            }\n\n            // Sam Edition Blue: force the authored Hidden Power Grass on League Manectric'''
          if old not in text:
              raise SystemExit('Blue IV hook opening anchor not found')
          text = text.replace(old, new, 1)
          old_tail = '''                CalculateMonStats(&party[i]);\n            }\n            }\n        }\n\n        gBattleTypeFlags |= gTrainers[trainerNum].doubleBattle;'''
          new_tail = '''                CalculateMonStats(&party[i]);\n            }\n        }\n\n        gBattleTypeFlags |= gTrainers[trainerNum].doubleBattle;'''
          if old_tail not in text:
              raise SystemExit('Blue IV hook closing anchor not found')
          text = text.replace(old_tail, new_tail, 1)
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/blue-chunk1-fix.yml
          git add src/battle_main.c
          git commit -m "Blue: place League Hidden Power IV hook after party construction"
          git push origin HEAD:sam/blue-main-rival
