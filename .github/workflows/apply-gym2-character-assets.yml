name: Apply Gym2 character asset recovery
on:
  push:
    branches:
      - sam/gym2-cerulean-reconcile-existing
    paths:
      - .github/workflows/apply-gym2-character-assets.yml
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover Cerulean character assets without stale allocations
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin sam-gym2-cerulean-complete
          for p in \
            graphics/trainers/front_pics/leilani_front_pic.png \
            graphics/trainers/front_pics/lehua_front_pic.png \
            graphics/trainers/front_pics/keahi_front_pic.png \
            graphics/trainers/palettes/leilani.pal \
            graphics/trainers/palettes/lehua.pal \
            graphics/trainers/palettes/keahi.pal \
            graphics/object_events/pics/people/leilani.png \
            graphics/object_events/pics/people/lehua.png \
            graphics/object_events/pics/people/keahi.png \
            graphics/object_events/palettes/leilani.pal \
            graphics/object_events/palettes/lehua.pal \
            graphics/object_events/palettes/keahi.pal
          do
            mkdir -p "$(dirname "$p")"
            git show "origin/sam-gym2-cerulean-complete:$p" > "$p"
          done
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          OLD='origin/sam-gym2-cerulean-complete'
          chars=('Leilani','Lehua','Keahi')

          def old(path):
              return subprocess.check_output(['git','show',f'{OLD}:{path}'], text=True)
          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def extract_block(text, marker):
              i=text.index(marker)
              start=text.rfind('\n',0,i)+1
              brace=text.index('{',i)
              depth=0
              for j in range(brace,len(text)):
                  if text[j]=='{': depth+=1
                  elif text[j]=='}':
                      depth-=1
                      if depth==0:
                          end=text.find(';',j)+1
                          return text[start:end]+'\n'
              raise RuntimeError(marker)
          def append_before_guard(path, block):
              t=read(path)
              if block.strip() in t: return
              pos=t.rfind('#endif')
              if pos < 0: t += '\n'+block
              else: t=t[:pos]+block+'\n'+t[pos:]
              write(path,t)
          def append_text(path, block, sentinel):
              t=read(path)
              if sentinel in t: return
              write(path,t.rstrip()+'\n\n'+block.rstrip()+'\n')

          # Trainer battle graphic declarations/data.
          ex=[]
          for c in chars:
              ex += [f'extern const u32 gTrainerFrontPic_{c}[];', f'extern const u16 gTrainerPalette_{c}[];']
          for c in chars:
              ex += [f'extern const u32 gObjectEventPic_{c}[];', f'extern const u16 gObjectEventPal_{c}[];']
          append_before_guard('include/graphics.h','\n'.join(ex)+'\n')

          tg='src/data/graphics/trainers.h'
          t=read(tg)
          additions=[]
          for c in chars:
              if f'gTrainerFrontPic_{c}[]' not in t:
                  additions.append(f'const u32 gTrainerFrontPic_{c}[] = INCBIN_U32("graphics/trainers/front_pics/{c.lower()}_front_pic.4bpp.lz");')
                  additions.append(f'const u16 gTrainerPalette_{c}[] = INCBIN_U16("graphics/trainers/palettes/{c.lower()}.gbapal");')
          if additions: write(tg,t.rstrip()+'\n\n'+'\n'.join(additions)+'\n')

          fp='src/data/trainer_graphics/front_pic_tables.h'
          t=read(fp)
          for c in chars:
              t=t.replace(f'TRAINER_SPRITE({c.upper()}, gTrainerFrontPic_ProfessorOak, 0x800)', f'TRAINER_SPRITE({c.upper()}, gTrainerFrontPic_{c}, 0x800)')
              t=t.replace(f'TRAINER_PAL({c.upper()}, gTrainerPalette_ProfessorOak)', f'TRAINER_PAL({c.upper()}, gTrainerPalette_{c})')
          write(fp,t)

          # Preserve the retired branch's static trainer animation aliases without touching newer allocations.
          fa='src/data/trainer_graphics/front_pic_anims.h'
          t=read(fa); o=old(fa)
          insert=''
          for c in chars:
              for marker in (f'static const union AnimCmd sAnimCmd_{c}[]', f'static const union AnimCmd *const sAnims_{c}[]'):
                  name=marker.split()[-1].split('[')[0]
                  if name not in t:
                      insert += '\n'+extract_block(o,marker)
          if insert:
              pivot='const union AnimCmd *const *const gTrainerFrontAnimsPtrTable[]'
              t=t.replace(pivot,insert+'\n'+pivot,1)
          for c in chars:
              t=t.replace(f'[TRAINER_PIC_{c.upper()}]               = sAnims_ProfessorOak,', f'[TRAINER_PIC_{c.upper()}]               = sAnims_{c},')
          write(fa,t)

          # Overworld raw graphic/palette declarations.
          og='src/data/object_events/object_event_graphics.h'
          t=read(og); adds=[]
          for c in chars:
              if f'gObjectEventPic_{c}[]' not in t:
                  adds.append(f'const u32 gObjectEventPic_{c}[] = INCBIN_U32("graphics/object_events/pics/people/{c.lower()}.4bpp");')
                  adds.append(f'const u16 gObjectEventPal_{c}[] = INCBIN_U16("graphics/object_events/palettes/{c.lower()}.gbapal");')
          if adds: write(og,t.rstrip()+'\n\n'+'\n'.join(adds)+'\n')

          # Four-frame stationary image tables.
          pt='src/data/object_events/object_event_pic_tables.h'
          t=read(pt); o=old(pt); add=''
          for c in chars:
              marker=f'static const struct SpriteFrameImage sPicTable_{c}[]'
              if f'sPicTable_{c}[]' not in t: add+='\n'+extract_block(o,marker)
          if add: write(pt,t.rstrip()+'\n'+add+'\n')

          # Shared stationary four-facing animation table used by all three.
          oa='src/data/object_events/object_event_anims.h'
          t=read(oa); o=old(oa); add=''
          for n in ('South','North','West','East'):
              marker=f'static const union AnimCmd sAnim_Stationary4Facing{n}[]'
              if f'sAnim_Stationary4Facing{n}[]' not in t: add+='\n'+extract_block(o,marker)
          marker='static const union AnimCmd *const sAnimTable_Stationary4Facing[]'
          if 'sAnimTable_Stationary4Facing[]' not in t: add+='\n'+extract_block(o,marker)
          if add: write(oa,t.rstrip()+'\n'+add+'\n')

          # Graphics info structs from the recovered implementation; tag names remain symbolic.
          gi='src/data/object_events/object_event_graphics_info.h'
          t=read(gi); o=old(gi); add=''
          for c in chars:
              marker=f'const struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_{c} ='
              if f'gObjectEventGraphicsInfo_{c} =' not in t: add+='\n'+extract_block(o,marker)
          if add: write(gi,t.rstrip()+'\n'+add+'\n')

          # Pointer declarations/bindings: replace only the three ARCH-006 placeholders.
          gp='src/data/object_events/object_event_graphics_info_pointers.h'
          t=read(gp)
          decl='\n'.join(f'const struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_{c};' for c in chars)+'\n'
          first='const struct ObjectEventGraphicsInfo *const gObjectEventGraphicsInfoPointers'
          if 'gObjectEventGraphicsInfo_Leilani;' not in t:
              t=t.replace(first,decl+'\n'+first,1)
          for c in chars:
              t=t.replace(f'[OBJ_EVENT_GFX_{c.upper()}] = &gObjectEventGraphicsInfo_ProfOak,', f'[OBJ_EVENT_GFX_{c.upper()}] = &gObjectEventGraphicsInfo_{c},')
          write(gp,t)

          # Current tree already owns 0x111C-0x111E (Scyther/Rhyhorn/Abra), so use next free tags.
          em='src/event_object_movement.c'
          t=read(em)
          tag_block='''#define OBJ_EVENT_PAL_TAG_LEILANI                     0x111F\n#define OBJ_EVENT_PAL_TAG_LEHUA                       0x1120\n#define OBJ_EVENT_PAL_TAG_KEAHI                       0x1121\n'''
          if 'OBJ_EVENT_PAL_TAG_LEILANI' not in t:
              t=t.replace('#define OBJ_EVENT_PAL_TAG_NONE                        0x11FF', tag_block+'#define OBJ_EVENT_PAL_TAG_NONE                        0x11FF',1)
          palette_lines='''    {gObjectEventPal_Leilani,                 OBJ_EVENT_PAL_TAG_LEILANI},\n    {gObjectEventPal_Lehua,                   OBJ_EVENT_PAL_TAG_LEHUA},\n    {gObjectEventPal_Keahi,                   OBJ_EVENT_PAL_TAG_KEAHI},\n'''
          if '{gObjectEventPal_Leilani,' not in t:
              t=t.replace('    {},\n};\n\nstatic const u16 sPlayerReflectionPaletteTags[]', palette_lines+'    {},\n};\n\nstatic const u16 sPlayerReflectionPaletteTags[]',1)
          write(em,t)
          PY
          rm -f .github/workflows/apply-gym2-character-assets.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Gym2: recover existing Cerulean character assets"
          git push origin HEAD:sam/gym2-cerulean-reconcile-existing
