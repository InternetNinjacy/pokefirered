name: CORE-002-003 Runtime State QA

on:
  push:
    branches:
      - qa/core-002-003-runtime-state
  workflow_dispatch:

jobs:
  runtime-state-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: qa/core-002-003-runtime-state

      - name: Install build and emulator dependencies
        run: |
          set -euxo pipefail
          sudo apt update
          sudo apt install -y build-essential binutils-arm-none-eabi git libpng-dev mgba-sdl
          mgba --version || true

      - name: Build and install agbcc
        run: |
          set -euxo pipefail
          cd ..
          git clone https://github.com/pret/agbcc.git
          cd agbcc
          ./build.sh
          ./install.sh ../pokefirered

      - name: Build QA ROM
        run: |
          set -euxo pipefail
          make
          test -f pokefirered.gba
          sha1sum pokefirered.gba | tee CORE002003_ROM_SHA1.txt
          git rev-parse HEAD | tee CORE002003_SOURCE_SHA.txt

      - name: Runtime phase 1
        run: |
          set -euxo pipefail
          rm -f pokefirered.sav
          export SDL_VIDEODRIVER=dummy
          export SDL_AUDIODRIVER=dummy
          timeout --signal=TERM 8s mgba -l 31 pokefirered.gba > core002003_phase1.log 2>&1 || test $? -eq 124 -o $? -eq 143
          cat core002003_phase1.log
          grep -q "CORE002003 PHASE1 PASS state saved" core002003_phase1.log
          test -f pokefirered.sav

      - name: Runtime phase 2
        run: |
          set -euxo pipefail
          export SDL_VIDEODRIVER=dummy
          export SDL_AUDIODRIVER=dummy
          timeout --signal=TERM 8s mgba -l 31 pokefirered.gba > core002003_phase2.log 2>&1 || test $? -eq 124 -o $? -eq 143
          cat core002003_phase2.log
          grep -q "CORE002003 PASS runtime persistence storage evolution species egg standard" core002003_phase2.log

      - name: Reject QA failure markers
        run: |
          set -euxo pipefail
          ! grep -h "CORE002003 FAIL" core002003_phase*.log

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: core-002-003-runtime-state-qa
          path: |
            pokefirered.gba
            pokefirered.sav
            CORE002003_ROM_SHA1.txt
            CORE002003_SOURCE_SHA.txt
            core002003_phase1.log
            core002003_phase2.log
          if-no-files-found: error
