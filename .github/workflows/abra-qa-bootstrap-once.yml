name: Abra QA bootstrap once

on:
  push:
    branches: [ qa/enc-002-abra-static-runtime ]
    paths: [ '.github/workflows/abra-qa-bootstrap-once.yml' ]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: qa/enc-002-abra-static-runtime
          fetch-depth: 0

      - name: Patch QA entry point
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/main.c')
          s=p.read_text()
          old='extern u32 intr_main[];\n'
          new='extern u32 intr_main[];\nvoid Enc002AbraQa_RunRuntimeQa(void);\n'
          if new not in s:
              if old not in s: raise SystemExit('main declaration anchor missing')
              s=s.replace(old,new,1)
          old='    SetNotInSaveFailedScreen();\n\n    // Revision 10 has no calls into libisagbprn except this one.\n'
          new='    SetNotInSaveFailedScreen();\n\n    Enc002AbraQa_RunRuntimeQa();\n\n    // Revision 10 has no calls into libisagbprn except this one.\n'
          if new not in s:
              if old not in s: raise SystemExit('main call anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)

      - name: Commit QA entry point
        run: |
          git config user.name "InternetNinjacy"
          git config user.email "45226145+InternetNinjacy@users.noreply.github.com"
          git add src/main.c
          git commit -m "QA: wire ENC-002 Abra runtime entry point"
          git push origin HEAD:qa/enc-002-abra-static-runtime
