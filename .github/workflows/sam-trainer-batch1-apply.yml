name: Sam trainer batch 1 apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - sam/enc-002-gfx-onix-assets

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'sam/trainers-batch1-viridian-opening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sam/trainers-batch1-viridian-opening

      - name: Apply Viridian opening trainer batch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          parties_path = Path('src/data/trainer_parties.h')
          text = parties_path.read_text()

          def party(name, mons):
              lines = [f'static const struct TrainerMonNoItemDefaultMoves {name}[] = {{']
              for level, species in mons:
                  lines += ['    {', '        .iv = 0,', f'        .lvl = {level},', f'        .species = {species},', '    },']
              lines.append('};')
              return '\n'.join(lines)

          replacements = {
              'sParty_BugCatcherRick': party('sParty_BugCatcherRick', [(6, 'SPECIES_WEEDLE'), (6, 'SPECIES_CATERPIE')]),
              'sParty_BugCatcherDoug': party('sParty_BugCatcherDoug', [(7, 'SPECIES_WURMPLE'), (7, 'SPECIES_KAKUNA'), (7, 'SPECIES_SPINARAK')]),
              'sParty_BugCatcherSammy': party('sParty_BugCatcherSammy', [(9, 'SPECIES_SPINARAK')]),
          }

          for name, replacement in replacements.items():
              pat = re.compile(r'(?ms)^static const struct TrainerMon(?:NoItem|Item)(?:DefaultMoves|CustomMoves) ' + re.escape(name) + r'\[\] = \{\n.*?^\};')
              text, count = pat.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'expected one declaration for {name}, found {count}')
          parties_path.write_text(text)

          map_path = Path('data/maps/ViridianForest/map.json')
          data = json.loads(map_path.read_text())
          remove_scripts = {'ViridianForest_EventScript_Anthony', 'ViridianForest_EventScript_Charlie'}
          before = len(data['object_events'])
          data['object_events'] = [obj for obj in data['object_events'] if obj.get('script') not in remove_scripts]
          if before - len(data['object_events']) != 2:
              raise SystemExit('expected to remove exactly Anthony and Charlie trainer objects')
          map_path.write_text(json.dumps(data, indent=2) + '\n')
          PY

          rm -f .github/workflows/sam-trainer-batch1-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trainer_parties.h data/maps/ViridianForest/map.json .github/workflows/sam-trainer-batch1-apply.yml
          git commit -m "Apply Viridian opening trainer batch"
          git push origin HEAD:sam/trainers-batch1-viridian-opening
