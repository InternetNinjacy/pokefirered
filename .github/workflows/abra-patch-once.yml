name: Abra registration patch

on:
  push:
    branches: [ sam/enc-002-gfx-abra-assets ]
    paths: [ '.github/workflows/abra-patch-once.yml' ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sam/enc-002-gfx-abra-assets
          fetch-depth: 0

      - name: Register Abra object-event resources
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  print(f"already patched: {path}")
                  return
              if old not in s:
                  raise SystemExit(f"anchor missing in {path}: {old[:80]!r}")
              p.write_text(s.replace(old, new, 1))
              print(f"patched: {path}")

          replace_once(
              "src/data/object_events/object_event_graphics.h",
              """const u16 gObjectEventPal_Rhyhorn[] = {\n    0x0000, 0x1083, 0x20E6, 0x2D49, 0x3DAC, 0x4A30, 0x5AB4, 0x6B38,\n    0x77BC, 0x62F6, 0x41EE, 0x316A, 0x2138, 0x4F5C, 0x6F7B, 0x7FFF,\n};\n""",
              """const u16 gObjectEventPal_Rhyhorn[] = {\n    0x0000, 0x1083, 0x20E6, 0x2D49, 0x3DAC, 0x4A30, 0x5AB4, 0x6B38,\n    0x77BC, 0x62F6, 0x41EE, 0x316A, 0x2138, 0x4F5C, 0x6F7B, 0x7FFF,\n};\nconst u16 gObjectEventPal_Abra[] = {\n    0x0000, 0x1087, 0x190D, 0x21B3, 0x1258, 0x16FD, 0x2F7F, 0x53BF,\n    0x0C64, 0x14CC, 0x21F7, 0x1B1E, 0x129B, 0x3B9F, 0x1D4F, 0x14A9,\n};\n"""
          )

          replace_once(
              "src/data/object_events/object_event_graphics.h",
              """const u16 gObjectEventPic_Machoke[] = INCBIN_U16(\"graphics/object_events/pics/pokemon/machoke.4bpp\");\nconst u32 gObjectEventPic_Rhyhorn[] = {\n""",
              """const u16 gObjectEventPic_Machoke[] = INCBIN_U16(\"graphics/object_events/pics/pokemon/machoke.4bpp\");\nconst u16 gObjectEventPic_Abra[] = INCBIN_U16(\"graphics/object_events/pics/pokemon/abra.4bpp\");\nconst u32 gObjectEventPic_Rhyhorn[] = {\n"""
          )

          replace_once(
              "src/data/object_events/object_event_pic_tables.h",
              """static const struct SpriteFrameImage sPicTable_Scyther[] = {\n""",
              """static const struct SpriteFrameImage sPicTable_Abra[] = {\n    overworld_frame(gObjectEventPic_Abra, 2, 2, 0),\n    overworld_frame(gObjectEventPic_Abra, 2, 2, 1),\n    overworld_frame(gObjectEventPic_Abra, 2, 2, 2),\n    overworld_frame(gObjectEventPic_Abra, 2, 2, 3),\n    overworld_frame(gObjectEventPic_Abra, 2, 2, 4),\n    overworld_frame(gObjectEventPic_Abra, 2, 2, 5),\n    overworld_frame(gObjectEventPic_Abra, 2, 2, 6),\n    overworld_frame(gObjectEventPic_Abra, 2, 2, 7),\n    overworld_frame(gObjectEventPic_Abra, 2, 2, 8),\n};\n\nstatic const struct SpriteFrameImage sPicTable_Scyther[] = {\n"""
          )

          replace_once(
              "src/event_object_movement.c",
              """#define OBJ_EVENT_PAL_TAG_RHYHORN                      0x111D\n#define OBJ_EVENT_PAL_TAG_NONE                        0x11FF\n""",
              """#define OBJ_EVENT_PAL_TAG_RHYHORN                      0x111D\n#define OBJ_EVENT_PAL_TAG_ABRA                         0x111E\n#define OBJ_EVENT_PAL_TAG_NONE                        0x11FF\n"""
          )

          replace_once(
              "src/event_object_movement.c",
              """    {gObjectEventPal_Rhyhorn,                 OBJ_EVENT_PAL_TAG_RHYHORN},\n    {gObjectEventPal_NpcWhite,                OBJ_EVENT_PAL_TAG_NPC_WHITE},\n""",
              """    {gObjectEventPal_Rhyhorn,                 OBJ_EVENT_PAL_TAG_RHYHORN},\n    {gObjectEventPal_Abra,                    OBJ_EVENT_PAL_TAG_ABRA},\n    {gObjectEventPal_NpcWhite,                OBJ_EVENT_PAL_TAG_NPC_WHITE},\n"""
          )

          replace_once(
              "src/data/object_events/object_event_graphics_info.h",
              """const struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_Scyther = {\n""",
              """const struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_Abra = {\n    .tileTag = TAG_NONE,\n    .paletteTag = OBJ_EVENT_PAL_TAG_ABRA,\n    .reflectionPaletteTag = OBJ_EVENT_PAL_TAG_NONE,\n    .size = 128,\n    .width = 16,\n    .height = 16,\n    .paletteSlot = PALSLOT_NPC_SPECIAL,\n    .shadowSize = SHADOW_SIZE_M,\n    .inanimate = FALSE,\n    .disableReflectionPaletteLoad = FALSE,\n    .tracks = TRACKS_FOOT,\n    .oam = &gObjectEventBaseOam_16x16,\n    .subspriteTables = gObjectEventSpriteOamTables_16x16,\n    .anims = sAnimTable_Standard,\n    .images = sPicTable_Abra,\n    .affineAnims = gDummySpriteAffineAnimTable,\n};\n\nconst struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_Scyther = {\n"""
          )

          replace_once(
              "src/data/object_events/object_event_graphics_info_pointers.h",
              """const struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_Rhyhorn;\nconst struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_Lapras;\n""",
              """const struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_Rhyhorn;\nconst struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_Abra;\nconst struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_Lapras;\n"""
          )

          replace_once(
              "src/data/object_events/object_event_graphics_info_pointers.h",
              """    [OBJ_EVENT_GFX_RHYHORN]                  = &gObjectEventGraphicsInfo_Rhyhorn,\n};\n""",
              """    [OBJ_EVENT_GFX_RHYHORN]                  = &gObjectEventGraphicsInfo_Rhyhorn,\n    [OBJ_EVENT_GFX_ABRA]                     = &gObjectEventGraphicsInfo_Abra,\n};\n"""
          )

      - name: Commit registration
        run: |
          git config user.name "InternetNinjacy"
          git config user.email "45226145+InternetNinjacy@users.noreply.github.com"
          git add src/data/object_events/object_event_graphics.h \
                  src/data/object_events/object_event_pic_tables.h \
                  src/data/object_events/object_event_graphics_info.h \
                  src/data/object_events/object_event_graphics_info_pointers.h \
                  src/event_object_movement.c
          git commit -m "ENC-002 GFX: register Abra overworld resources"
          git push origin HEAD:sam/enc-002-gfx-abra-assets
