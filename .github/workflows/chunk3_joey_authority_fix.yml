name: Apply Joey Authority Fix

on:
  push:
    branches:
      - sam/oak-002-joey-chunk3
    paths:
      - tools/chunk3_joey_authority_fix.py
      - .github/workflows/chunk3_joey_authority_fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sam/oak-002-joey-chunk3
          fetch-depth: 0
      - run: python3 tools/chunk3_joey_authority_fix.py
      - run: rm -f tools/chunk3_joey_authority_fix.py .github/workflows/chunk3_joey_authority_fix.yml
      - run: |
          git config user.name "Pokemon Sam Production"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Align Joey battle data with current authority"
          git push origin HEAD:sam/oak-002-joey-chunk3
