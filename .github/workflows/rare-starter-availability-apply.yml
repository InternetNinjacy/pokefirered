name: Apply rare starter availability

on:
  push:
    branches:
      - sam/rare-starter-wild-availability

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Implement rare starter wild availability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sam/rare-starter-wild-availability
          fetch-depth: 0

      - name: Apply bounded encounter-table deltas
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('src/data/wild_encounters.json')
          text = path.read_text()
          data = json.loads(text)
          encounters = data['wild_encounter_groups'][0]['encounters']

          def get_map(name):
              found = [e for e in encounters if e.get('map') == name and e.get('base_label', '').endswith('_FireRed')]
              assert len(found) == 1, (name, len(found))
              return found[0]

          safari = get_map('MAP_SAFARI_ZONE_CENTER')
          seafoam = get_map('MAP_SEAFOAM_ISLANDS_B4F')
          ember = get_map('MAP_MT_EMBER_EXTERIOR')

          assert safari['land_mons']['mons'][7] == {'min_level': 30, 'max_level': 30, 'species': 'SPECIES_PARASECT'}
          assert seafoam['land_mons']['mons'][11] == {'min_level': 30, 'max_level': 30, 'species': 'SPECIES_GOLBAT'}
          assert ember['land_mons']['mons'][8] == {'min_level': 30, 'max_level': 30, 'species': 'SPECIES_SPEAROW'}

          def replace_in_map(map_name, old, new, occurrence=1):
              global text
              marker = f'"map": "{map_name}"'
              start = text.index(marker)
              nxt = text.find('\n        {\n          "map": ', start + len(marker))
              end = len(text) if nxt == -1 else nxt
              block = text[start:end]
              positions = []
              pos = 0
              while True:
                  pos = block.find(old, pos)
                  if pos == -1:
                      break
                  positions.append(pos)
                  pos += len(old)
              assert len(positions) >= occurrence, (map_name, old, len(positions), occurrence)
              pos = positions[occurrence - 1]
              block = block[:pos] + new + block[pos + len(old):]
              text = text[:start] + block + text[end:]

          replace_in_map(
              'MAP_SAFARI_ZONE_CENTER',
              '"min_level": 30,\n                "max_level": 30,\n                "species": "SPECIES_PARASECT"',
              '"min_level": 22,\n                "max_level": 22,\n                "species": "SPECIES_BULBASAUR"'
          )
          replace_in_map(
              'MAP_SEAFOAM_ISLANDS_B4F',
              '"min_level": 30,\n                "max_level": 30,\n                "species": "SPECIES_GOLBAT"',
              '"min_level": 28,\n                "max_level": 28,\n                "species": "SPECIES_SQUIRTLE"'
          )
          replace_in_map(
              'MAP_MT_EMBER_EXTERIOR',
              '"min_level": 30,\n                "max_level": 30,\n                "species": "SPECIES_SPEAROW"',
              '"min_level": 30,\n                "max_level": 30,\n                "species": "SPECIES_CHARMANDER"',
              occurrence=1
          )

          updated = json.loads(text)
          encounters2 = updated['wild_encounter_groups'][0]['encounters']
          def get_map2(name):
              return next(e for e in encounters2 if e.get('map') == name and e.get('base_label', '').endswith('_FireRed'))
          assert get_map2('MAP_SAFARI_ZONE_CENTER')['land_mons']['mons'][7] == {'min_level': 22, 'max_level': 22, 'species': 'SPECIES_BULBASAUR'}
          assert get_map2('MAP_SEAFOAM_ISLANDS_B4F')['land_mons']['mons'][11] == {'min_level': 28, 'max_level': 28, 'species': 'SPECIES_SQUIRTLE'}
          assert get_map2('MAP_MT_EMBER_EXTERIOR')['land_mons']['mons'][8] == {'min_level': 30, 'max_level': 30, 'species': 'SPECIES_CHARMANDER'}
          path.write_text(text)
          PY

      - name: Commit production delta and remove temporary applicator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rare-starter-availability-apply.yml
          git add src/data/wild_encounters.json
          git commit -m "Implement rare starter wild availability"
          git push origin HEAD:refs/heads/sam/rare-starter-wild-availability
