name: Gym8 production closure insertion

on:
  push:
    branches:
      - "sam/gym8-viridian-production-closure"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "sam/gym8-viridian-production-closure"
          fetch-depth: 0
      - run: python3 tools/gym8_patch_trainers.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trainers.h
          git rm .github/workflows/gym8-production-closure-insert.yml tools/gym8_patch_trainers.py
          git commit -m "GYM8: bind Viridian Satoshi trainer records"
          git push origin HEAD:sam/gym8-viridian-production-closure
