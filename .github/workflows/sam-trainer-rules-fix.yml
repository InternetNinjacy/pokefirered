name: Sam trainer rules correction

on:
  push:
    branches:
      - sam/trainer-rules-application

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sam/trainer-rules-application

      - name: Restore protected Vermilion Gym parties
        shell: bash
        run: |
          git fetch origin sam/enc-002-gfx-onix-assets
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          base_ref = 'origin/sam/enc-002-gfx-onix-assets'
          parties_path = Path('src/data/trainer_parties.h')
          trainers_path = Path('src/data/trainers.h')
          cur_parties = parties_path.read_text()
          cur_trainers = trainers_path.read_text()
          base_parties = subprocess.check_output(['git','show',f'{base_ref}:src/data/trainer_parties.h'], text=True)

          party_names = [
              'sParty_LifeguardTylerVermilion',
              'sParty_BeachFamilyLisaBenVermilion',
          ]

          def extract_decl(text, party):
              pat = re.compile(
                  r'(?ms)^static const struct TrainerMon(?:NoItem|Item)(?:DefaultMoves|CustomMoves) '
                  + re.escape(party) + r'\[\] = \{\n.*?^\};'
              )
              m = pat.search(text)
              if not m:
                  raise SystemExit(f'missing party declaration: {party}')
              return m.group(0)

          for party in party_names:
              base_decl = extract_decl(base_parties, party)
              current_decl = extract_decl(cur_parties, party)
              cur_parties = cur_parties.replace(current_decl, base_decl, 1)

          parties_path.write_text(cur_parties)

          fixes = {
              'TRAINER_LIFEGUARD_TYLER_VERMILION': ('WADE', 'NO_ITEM_CUSTOM_MOVES', 'sParty_LifeguardTylerVermilion'),
              'TRAINER_BEACH_FAMILY_LISA_BEN_VERMILION': ('RIVER&FINN', 'NO_ITEM_CUSTOM_MOVES', 'sParty_BeachFamilyLisaBenVermilion'),
          }
          for tid, (name, macro, party) in fixes.items():
              pat = re.compile(r'(?ms)(^    \[' + re.escape(tid) + r'\] = \{\n)(.*?)(^    \},)')
              m = pat.search(cur_trainers)
              if not m:
                  raise SystemExit(f'missing trainer record: {tid}')
              block = m.group(2)
              block = re.sub(r'(\.trainerName\s*=\s*_\(")[^"]*("\))', lambda x: x.group(1)+name+x.group(2), block, count=1)
              block = re.sub(r'(\.party\s*=\s*)[A-Z_]+\(' + re.escape(party) + r'\)', r'\1' + macro + '(' + party + ')', block, count=1)
              cur_trainers = cur_trainers[:m.start()] + m.group(1) + block + m.group(3) + cur_trainers[m.end():]

          trainers_path.write_text(cur_trainers)
          PY

          rm -f .github/workflows/sam-trainer-rules-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trainers.h src/data/trainer_parties.h .github/workflows/sam-trainer-rules-fix.yml
          git commit -m "Preserve authored Vermilion Gym trainer parties"
          git push origin HEAD:sam/trainer-rules-application
