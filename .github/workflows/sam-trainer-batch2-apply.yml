name: Sam trainer batch 2 apply

on:
  push:
    branches:
      - sam/trainers-batch2-pewter-mtmoon

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sam/trainers-batch2-pewter-mtmoon

      - name: Apply Route 3 and Mt Moon trainer batch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          parties_path = Path('src/data/trainer_parties.h')
          trainers_path = Path('src/data/trainers.h')
          mt1_scripts_path = Path('data/maps/MtMoon_1F/scripts.inc')
          mtb2_scripts_path = Path('data/maps/MtMoon_B2F/scripts.inc')

          parties = parties_path.read_text()
          trainers = trainers_path.read_text()
          mt1 = mt1_scripts_path.read_text()
          mtb2 = mtb2_scripts_path.read_text()

          def party_decl(name, mons):
              lines = [f'static const struct TrainerMonNoItemDefaultMoves {name}[] = {{']
              for level, species in mons:
                  lines += [
                      '    {',
                      '        .iv = 0,',
                      f'        .lvl = {level},',
                      f'        .species = {species},',
                      '    },',
                  ]
              lines.append('};')
              return '\n'.join(lines)

          replacements = {
              # Route 3 settled teams
              'sParty_LassJanice': [(9,'SPECIES_NIDORAN_F'), (9,'SPECIES_SPEAROW')],
              'sParty_BugCatcherColton': [(8,'SPECIES_WEEDLE'), (8,'SPECIES_METAPOD'), (8,'SPECIES_KAKUNA')],
              'sParty_YoungsterBen': [(10,'SPECIES_SPEAROW'), (8,'SPECIES_EKANS'), (9,'SPECIES_MANKEY')],
              'sParty_BugCatcherGreg': [(8,'SPECIES_CATERPIE'), (8,'SPECIES_METAPOD'), (8,'SPECIES_WEEDLE'), (8,'SPECIES_KAKUNA')],
              'sParty_YoungsterCalvin': [(10,'SPECIES_SPEAROW'), (11,'SPECIES_MANKEY')],
              'sParty_LassSally': [(10,'SPECIES_NIDORAN_F'), (10,'SPECIES_NIDORAN_M')],
              'sParty_BugCatcherJames': [(11,'SPECIES_SPINARAK'), (11,'SPECIES_CASCOON')],
              'sParty_LassRobin': [(14,'SPECIES_JIGGLYPUFF')],

              # Mt. Moon settled seven non-Rocket trainers
              'sParty_LassIris': [(14,'SPECIES_CLEFAIRY'), (14,'SPECIES_JIGGLYPUFF')],
              'sParty_BugCatcherKent': [(11,'SPECIES_WEEDLE'), (11,'SPECIES_KAKUNA')],
              'sParty_SuperNerdJovan': [(12,'SPECIES_MAGNEMITE'), (12,'SPECIES_VOLTORB')],
              'sParty_BugCatcherRobby': [(13,'SPECIES_PARAS'), (13,'SPECIES_BUTTERFREE'), (13,'SPECIES_BEEDRILL')],
              'sParty_LassMiriam': [(13,'SPECIES_ODDISH'), (13,'SPECIES_BELLSPROUT')],
              'sParty_YoungsterJosh': [(13,'SPECIES_ZUBAT'), (13,'SPECIES_GEODUDE'), (14,'SPECIES_SANDSHREW')],
              'sParty_HikerMarcos': [(14,'SPECIES_GEODUDE'), (15,'SPECIES_ONIX')],

              # Mt. Moon ordinary Rocket Grunts
              'sParty_TeamRocketGrunt': [(14,'SPECIES_SANDSHREW'), (14,'SPECIES_RATTATA'), (14,'SPECIES_ZUBAT')],
              'sParty_TeamRocketGrunt2': [(14,'SPECIES_ZUBAT'), (14,'SPECIES_EKANS'), (14,'SPECIES_KOFFING')],
              'sParty_TeamRocketGrunt3': [(15,'SPECIES_RATTATA'), (15,'SPECIES_SANDSHREW'), (14,'SPECIES_DROWZEE')],
              'sParty_TeamRocketGrunt4': [(15,'SPECIES_EKANS'), (15,'SPECIES_ZUBAT'), (15,'SPECIES_KOFFING')],
          }

          for name, mons in replacements.items():
              pat = re.compile(
                  r'(?ms)^static const struct TrainerMon(?:NoItem|Item)(?:DefaultMoves|CustomMoves) '
                  + re.escape(name) + r'\[\] = \{\n.*?^\};'
              )
              parties, count = pat.subn(party_decl(name, mons), parties, count=1)
              if count != 1:
                  raise SystemExit(f'expected exactly one party declaration for {name}, found {count}')

          # Ensure the relevant ordinary trainer records use the no-item/default-move baseline,
          # and set only the settled Mt. Moon Double Battles.
          double_ids = {
              'TRAINER_BUG_CATCHER_KENT',
              'TRAINER_BUG_CATCHER_ROBBY',
              'TRAINER_HIKER_MARCOS',
              'TRAINER_TEAM_ROCKET_GRUNT_4',
          }
          touched_ids = {
              'TRAINER_LASS_JANICE','TRAINER_BUG_CATCHER_COLTON','TRAINER_YOUNGSTER_BEN',
              'TRAINER_BUG_CATCHER_GREG','TRAINER_YOUNGSTER_CALVIN','TRAINER_LASS_SALLY',
              'TRAINER_BUG_CATCHER_JAMES','TRAINER_LASS_ROBIN','TRAINER_LASS_IRIS',
              'TRAINER_BUG_CATCHER_KENT','TRAINER_SUPER_NERD_JOVAN','TRAINER_BUG_CATCHER_ROBBY',
              'TRAINER_LASS_MIRIAM','TRAINER_YOUNGSTER_JOSH','TRAINER_HIKER_MARCOS',
              'TRAINER_TEAM_ROCKET_GRUNT','TRAINER_TEAM_ROCKET_GRUNT_2',
              'TRAINER_TEAM_ROCKET_GRUNT_3','TRAINER_TEAM_ROCKET_GRUNT_4',
          }

          record_pat = re.compile(r'(?ms)(^    \[(TRAINER_[A-Z0-9_]+)\] = \{\n)(.*?)(^    \},)')
          out = []
          pos = 0
          seen = set()
          for m in record_pat.finditer(trainers):
              out.append(trainers[pos:m.start()])
              tid = m.group(2)
              block = m.group(3)
              if tid in touched_ids:
                  seen.add(tid)
                  block = re.sub(r'(\.doubleBattle\s*=\s*)(TRUE|FALSE)', r'\g<1>' + ('TRUE' if tid in double_ids else 'FALSE'), block, count=1)
                  block = re.sub(r'(\.party\s*=\s*)[A-Z_]+\((sParty_[A-Za-z0-9_]+)\)', r'\1NO_ITEM_DEFAULT_MOVES(\2)', block, count=1)
              out.append(m.group(1) + block + m.group(4))
              pos = m.end()
          out.append(trainers[pos:])
          trainers = ''.join(out)
          missing = touched_ids - seen
          if missing:
              raise SystemExit(f'missing trainer records: {sorted(missing)}')

          # The existing dialogue is preserved. Double battle scripts reuse the existing
          # neutral "need at least two Pokémon" system line already authored for Kent.
          script_replacements = {
              'trainerbattle_single TRAINER_HIKER_MARCOS, MtMoon_1F_Text_MarcosIntro, MtMoon_1F_Text_MarcosDefeat':
                  'trainerbattle_double TRAINER_HIKER_MARCOS, MtMoon_1F_Text_MarcosIntro, MtMoon_1F_Text_MarcosDefeat, MtMoon_1F_Text_KentNotEnoughMons',
              'trainerbattle_single TRAINER_BUG_CATCHER_ROBBY, MtMoon_1F_Text_RobbyIntro, MtMoon_1F_Text_RobbyDefeat':
                  'trainerbattle_double TRAINER_BUG_CATCHER_ROBBY, MtMoon_1F_Text_RobbyIntro, MtMoon_1F_Text_RobbyDefeat, MtMoon_1F_Text_KentNotEnoughMons',
          }
          for old, new in script_replacements.items():
              if old not in mt1:
                  raise SystemExit(f'Mt Moon 1F expected script line missing: {old}')
              mt1 = mt1.replace(old, new, 1)

          old = 'trainerbattle_single TRAINER_TEAM_ROCKET_GRUNT_4, MtMoon_B2F_Text_Grunt4Intro, MtMoon_B2F_Text_Grunt4Defeat'
          new = 'trainerbattle_double TRAINER_TEAM_ROCKET_GRUNT_4, MtMoon_B2F_Text_Grunt4Intro, MtMoon_B2F_Text_Grunt4Defeat, MtMoon_1F_Text_KentNotEnoughMons'
          if old not in mtb2:
              raise SystemExit('Mt Moon B2F Grunt4 script line missing')
          mtb2 = mtb2.replace(old, new, 1)

          parties_path.write_text(parties)
          trainers_path.write_text(trainers)
          mt1_scripts_path.write_text(mt1)
          mtb2_scripts_path.write_text(mtb2)
          PY

          rm -f .github/workflows/sam-trainer-batch2-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trainer_parties.h src/data/trainers.h data/maps/MtMoon_1F/scripts.inc data/maps/MtMoon_B2F/scripts.inc .github/workflows/sam-trainer-batch2-apply.yml
          git commit -m "Apply Pewter and Mt Moon trainer batch"
          git push origin HEAD:sam/trainers-batch2-pewter-mtmoon
