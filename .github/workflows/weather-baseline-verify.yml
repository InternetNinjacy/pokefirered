name: Pokémon Weather Baseline Verification

on:
  push:
    branches:
      - weather-baseline-verify
  pull_request:
    branches:
      - weather-dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: FIRERED
      GAME_LANGUAGE: ENGLISH
      GAME_REVISION: 0
      MODERN: 1
      COMPARE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build untouched pinned baseline
        run: make -j$(nproc) all
