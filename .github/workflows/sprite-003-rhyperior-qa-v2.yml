name: SPRITE-003 Rhyperior QA v2
on:
  push:
    branches: [qa/sprite-003-rhyperior-v2]
  pull_request:
    branches: [sam/sprite-003-rhyperior-assets]
  workflow_dispatch:
jobs:
  rhyperior-qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/sprite-003-rhyperior-v2
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          timeout 300s sudo apt-get update
          timeout 900s sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi git libpng-dev
      - name: Build and install agbcc
        run: |
          set -euxo pipefail
          cd ..
          git clone https://github.com/pret/agbcc.git
          cd agbcc
          ./build.sh
          ./install.sh ../pokefirered
      - name: Verify Rhyperior contract
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor f2c3e182dd9f97e868e4adbbab6ef4694cf28839 HEAD
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path

          def verify_png(path, expected):
              d = Path(path).read_bytes()
              assert d[:8] == b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II', d[16:24]) == expected, (path, struct.unpack('>II', d[16:24]))
              p = 8
              while p < len(d):
                  n = struct.unpack('>I', d[p:p+4])[0]
                  typ = d[p+4:p+8]
                  payload = d[p+8:p+8+n]
                  crc = struct.unpack('>I', d[p+8+n:p+12+n])[0]
                  assert zlib.crc32(typ + payload) & 0xffffffff == crc, (path, typ)
                  p += 12 + n
                  if typ == b'IEND':
                      break

          verify_png('graphics/pokemon/rhyperior/front.png', (64,64))
          verify_png('graphics/pokemon/rhyperior/back.png', (64,64))
          verify_png('graphics/pokemon/rhyperior/icon.png', (32,64))
          verify_png('graphics/pokemon/rhyperior/footprint.png', (16,16))

          for pal in ('normal.pal', 'shiny.pal'):
              lines = Path('graphics/pokemon/rhyperior/' + pal).read_text().splitlines()
              assert lines[:3] == ['JASC-PAL', '0100', '16'], (pal, lines[:3])
              assert len(lines[3:]) == 16, (pal, len(lines[3:]))

          checks = {
              'src/data/pokemon_graphics/front_pic_table.h': 'SPECIES_SPRITE(RHYPERIOR, gMonFrontPic_Rhyperior)',
              'src/data/pokemon_graphics/back_pic_table.h': 'SPECIES_SPRITE(RHYPERIOR, gMonBackPic_Rhyperior)',
              'src/data/pokemon_graphics/palette_table.h': 'SPECIES_PAL(RHYPERIOR, gMonPalette_Rhyperior)',
              'src/data/pokemon_graphics/shiny_palette_table.h': 'SPECIES_SHINY_PAL(RHYPERIOR, gMonShinyPalette_Rhyperior)',
              'src/data/pokemon_graphics/footprint_table.h': '[SPECIES_RHYPERIOR] = gMonFootprint_Rhyperior',
              'src/pokemon_icon.c': '[SPECIES_RHYPERIOR]   = gMonIcon_Rhyperior',
              'src/data/pokemon/cry_ids.h': '[SPECIES_RHYPERIOR - HOENN_MON_SPECIES_START] = SPECIES_RHYDON - 1',
              'src/sam_rhyperior_graphics.c': 'gMonShinyPalette_Rhyperior',
              'include/graphics.h': 'extern const u8 gMonFootprint_Rhyperior[];'
          }
          for path, token in checks.items():
              assert token in Path(path).read_text(), (path, token)

          icon = Path('src/pokemon_icon.c').read_text().split('const u8 gMonIconPaletteIndices[]', 1)[1]
          assert '[SPECIES_RHYPERIOR]   = 0' in icon

          front = Path('src/data/pokemon_graphics/front_pic_coordinates.h').read_text().split('[SPECIES_RHYPERIOR] =', 1)[1].split('[SPECIES_EGG]', 1)[0]
          back = Path('src/data/pokemon_graphics/back_pic_coordinates.h').read_text().split('[SPECIES_RHYPERIOR] =', 1)[1].split('[SPECIES_EGG]', 1)[0]
          assert 'MON_COORDS_SIZE(64, 64)' in front and '.y_offset = 2' in front
          assert 'MON_COORDS_SIZE(64, 64)' in back and '.y_offset = 0' in back

          evo = Path('src/data/pokemon/evolution.h').read_text()
          assert 'SPECIES_RHYPERIOR' in evo and 'ITEM_PROTECTOR' in evo

          print('SPRITE-003 RHYPERIOR CONTRACT PASS')
          PY
      - name: Build QA ROM
        run: |
          set -euxo pipefail
          make modern 2>&1 | tee SPRITE003_RHYPERIOR_BUILD.log
          test -f pokefirered_modern.gba
          sha1sum pokefirered_modern.gba | tee SPRITE003_RHYPERIOR_QA_ROM_SHA1.txt
          git rev-parse HEAD | tee SPRITE003_RHYPERIOR_QA_SOURCE_SHA.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprite-003-rhyperior-qa-v2
          path: |
            pokefirered_modern.gba
            SPRITE003_RHYPERIOR_BUILD.log
            SPRITE003_RHYPERIOR_QA_ROM_SHA1.txt
            SPRITE003_RHYPERIOR_QA_SOURCE_SHA.txt
          if-no-files-found: warn
