name: Gym5 IV Preservation

on:
  push:
    branches: [ sam/gym5-fuchsia-normal ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sam/gym5-fuchsia-normal
          fetch-depth: 0
      - name: Preserve pre-existing Tamer IVs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/data/trainer_parties.h')
          text = path.read_text()
          for name, expected_count in [('sParty_TamerPhil', 2), ('sParty_TamerEdgar', 3)]:
              pattern = re.compile(rf'(static const struct TrainerMonNoItemDefaultMoves {name}\[\] = \{{.*?\n\}};)', re.S)
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f'party block missing: {name}')
              block = match.group(1)
              if block.count('.iv = 0,') != expected_count:
                  raise SystemExit(f'unexpected IV shape for {name}')
              block = block.replace('.iv = 0,', '.iv = 40,')
              text = text[:match.start(1)] + block + text[match.end(1):]
          path.write_text(text)
          PY
          git diff --check
          git diff -- src/data/trainer_parties.h
      - name: Commit IV preservation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/trainer_parties.h
          if git diff --cached --quiet; then
            echo 'No IV changes needed.'
          else
            git commit -m 'Preserve Fuchsia Tamer IV baselines'
            git push origin HEAD:sam/gym5-fuchsia-normal
          fi
