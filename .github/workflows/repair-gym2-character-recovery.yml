name: Repair Gym2 character recovery
on:
  push:
    branches:
      - sam/gym2-cerulean-reconcile-existing
    paths:
      - .github/workflows/repair-gym2-character-recovery.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          sed -i 's#git fetch origin sam-gym2-cerulean-complete#git fetch origin refs/heads/sam-gym2-cerulean-complete:refs/remotes/origin/sam-gym2-cerulean-complete#' .github/workflows/apply-gym2-character-assets.yml
          rm -f .github/workflows/repair-gym2-character-recovery.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: repair Gym2 character asset recovery"
          git push origin HEAD:sam/gym2-cerulean-reconcile-existing
