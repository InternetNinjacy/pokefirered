name: Apply Joey Chunk 3

on:
  push:
    branches:
      - sam/oak-002-joey-chunk3
    paths:
      - tools/chunk3_joey_patch.py
      - .github/workflows/chunk3_joey_apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sam/oak-002-joey-chunk3
          fetch-depth: 0
      - name: Apply production patch
        run: python3 tools/chunk3_joey_patch.py
      - name: Remove temporary patch machinery
        run: rm -f tools/chunk3_joey_patch.py .github/workflows/chunk3_joey_apply.yml
      - name: Commit patched production source
        run: |
          git config user.name "Pokemon Sam Production"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implement OAK-002 Joey battle package"
          git push origin HEAD:sam/oak-002-joey-chunk3
