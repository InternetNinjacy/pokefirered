name: SPRITE-003 Ectoceon QA v1
on:
  push:
    branches: [qa/sprite-003-ectoceon-v1]
  pull_request:
    branches: [sam/sprite-003-ectoceon-assets]
  workflow_dispatch:
jobs:
  ectoceon-qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/sprite-003-ectoceon-v1
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          timeout 300s sudo apt-get update
          timeout 900s sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi git libpng-dev
      - name: Build and install agbcc
        run: |
          set -euxo pipefail
          cd ..
          git clone https://github.com/pret/agbcc.git
          cd agbcc
          ./build.sh
          ./install.sh ../pokefirered
      - name: Verify Ectoceon contract
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor 0ffe87168cb449a7f83b6595b5d1d95051ced901 HEAD
          python3 - <<'PY'
          import hashlib, struct, zlib
          from pathlib import Path
          expected_sha = {
              'graphics/pokemon/ectoceon/front.png':'5d085260c71847cbf0aa4152d410b7e363df090e',
              'graphics/pokemon/ectoceon/back.png':'6398c1768134a1aa84d1d0adda5746d1a5fcd976',
              'graphics/pokemon/ectoceon/icon.png':'26ccda0ab68a060f8dc5c531fd0e3aaf8ba5e42f',
          }
          def verify_png(path, dims):
              d=Path(path).read_bytes()
              assert hashlib.sha1(d).hexdigest() == expected_sha[path], path
              assert d[:8] == b'\x89PNG\r\n\x1a\n'
              w,h,bit_depth,color_type = struct.unpack('>IIBB', d[16:26])
              assert (w,h) == dims, (path,w,h)
              assert color_type == 3 and bit_depth <= 4, (path,bit_depth,color_type)
              p=8; saw_plte=False
              while p < len(d):
                  n=struct.unpack('>I',d[p:p+4])[0]
                  typ=d[p+4:p+8]; payload=d[p+8:p+8+n]
                  crc=struct.unpack('>I',d[p+8+n:p+12+n])[0]
                  assert zlib.crc32(typ+payload)&0xffffffff == crc, (path,typ)
                  if typ == b'PLTE':
                      saw_plte=True
                      assert n//3 <= 16, (path,n//3)
                  p += 12+n
                  if typ == b'IEND': break
              assert saw_plte
          verify_png('graphics/pokemon/ectoceon/front.png',(64,64))
          verify_png('graphics/pokemon/ectoceon/back.png',(64,64))
          verify_png('graphics/pokemon/ectoceon/icon.png',(32,64))
          checks={
           'src/data/pokemon_graphics/front_pic_table.h':'SPECIES_SPRITE(ECTOCEON, gMonFrontPic_Ectoceon)',
           'src/data/pokemon_graphics/back_pic_table.h':'SPECIES_SPRITE(ECTOCEON, gMonBackPic_Ectoceon)',
           'src/data/pokemon_graphics/palette_table.h':'SPECIES_PAL(ECTOCEON, gMonPalette_Ectoceon)',
           'src/data/pokemon_graphics/shiny_palette_table.h':'SPECIES_SHINY_PAL(ECTOCEON, gMonShinyPalette_Ectoceon)',
           'src/data/pokemon_graphics/footprint_table.h':'[SPECIES_ECTOCEON] = gMonFootprint_Eevee',
           'src/pokemon_icon.c':'[SPECIES_ECTOCEON]    = gMonIcon_Ectoceon',
           'src/data/pokemon/cry_ids.h':'[SPECIES_ECTOCEON - HOENN_MON_SPECIES_START] = SPECIES_VAPOREON - 1',
           'src/sam_ectoceon_graphics.c':'gMonShinyPalette_Ectoceon',
          }
          for p,t in checks.items():
              assert t in Path(p).read_text(), (p,t)
          icon = Path('src/pokemon_icon.c').read_text().split('const u8 gMonIconPaletteIndices[]',1)[1]
          assert '[SPECIES_ECTOCEON]    = 2' in icon
          f=Path('src/data/pokemon_graphics/front_pic_coordinates.h').read_text().split('[SPECIES_ECTOCEON] =',1)[1].split('[SPECIES_RHYPERIOR]',1)[0]
          b=Path('src/data/pokemon_graphics/back_pic_coordinates.h').read_text().split('[SPECIES_ECTOCEON] =',1)[1].split('[SPECIES_RHYPERIOR]',1)[0]
          assert 'MON_COORDS_SIZE(56, 56)' in f and '.y_offset = 3' in f
          assert 'MON_COORDS_SIZE(56, 56)' in b and '.y_offset = 2' in b
          si=Path('src/data/pokemon/species_info.h').read_text()
          e=si.split('[SPECIES_ECTOCEON] =',1)[1].split('[SPECIES_RHYPERIOR]',1)[0]
          assert 'ABILITY_SOUL_ROT' in e
          evo=Path('src/data/pokemon/evolution.h').read_text()
          eevee=evo.split('[SPECIES_EEVEE] =',1)[1].split('[SPECIES_VAPOREON]',1)[0]
          assert 'ITEM_BRICK' in eevee and 'SPECIES_ECTOCEON' in eevee
          assert not Path('tools/apply_ectoceon_assets.py').exists()
          assert not Path('.github/workflows/zz-apply-ectoceon-assets.yml').exists()
          print('SPRITE-003 ECTOCEON CONTRACT PASS')
          PY
      - name: Build QA ROM
        run: |
          set -euxo pipefail
          make modern 2>&1 | tee SPRITE003_ECTOCEON_BUILD.log
          test -f pokefirered_modern.gba
          sha1sum pokefirered_modern.gba | tee SPRITE003_ECTOCEON_QA_ROM_SHA1.txt
          git rev-parse HEAD | tee SPRITE003_ECTOCEON_QA_SOURCE_SHA.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprite-003-ectoceon-qa-v1
          path: |
            pokefirered_modern.gba
            SPRITE003_ECTOCEON_BUILD.log
            SPRITE003_ECTOCEON_QA_ROM_SHA1.txt
            SPRITE003_ECTOCEON_QA_SOURCE_SHA.txt
          if-no-files-found: warn
