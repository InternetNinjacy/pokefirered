name: START CORE-003 Runtime Matrix QA

on:
  push:
    branches:
      - qa/start-core003-runtime-matrix
  workflow_dispatch:

jobs:
  runtime-matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/start-core003-runtime-matrix

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt update
          sudo apt install -y build-essential binutils-arm-none-eabi git libpng-dev mgba-sdl
          mgba --version || true

      - name: Build and install agbcc
        run: |
          set -euxo pipefail
          cd ..
          git clone https://github.com/pret/agbcc.git
          cd agbcc
          ./build.sh
          ./install.sh ../pokefirered

      - name: Static cross-system regression assertions
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          stone_tokens = [
              "ITEM_FIRE_STONE", "ITEM_THUNDER_STONE", "ITEM_WATER_STONE",
              "ITEM_LEAF_STONE", "ITEM_SUN_STONE", "ITEM_MOON_STONE"
          ]
          stone_shop_files = []
          for p in Path("data/maps").rglob("scripts.inc"):
              text = p.read_text(errors="ignore")
              if "pokemart" in text and any(t in text for t in stone_tokens):
                  stone_shop_files.append(str(p))
                  assert "ITEM_BRICK" in text, f"Brick missing from evolution-stone shop {p}"

          assert stone_shop_files, "No evolution-stone shops detected"
          assert not any("ITEM_ADAPTIVE_GENE" in p.read_text(errors="ignore") for p in Path("data/maps").rglob("*.inc"))

          oak = Path("data/maps/PalletTown_ProfessorOaksLab/scripts.inc").read_text()
          assert "special GiveSamStarter\n\tspecial MarkSamOriginalStarter" in oak
          assert "VAR_SAM_STARTER" not in oak

          party = Path("src/party_menu.c").read_text()
          invalid_gate = party.index("noEffect = PokemonItemUseNoEffect")
          remove = party.index("RemoveBagItem(gSpecialVar_ItemId, 1);", invalid_gate)
          assert invalid_gate < remove
          assert "if (noEffect)" in party[invalid_gate:remove]
          assert "Task_DoUseItemAnim(taskId);" in party[invalid_gate:remove]

          battle = Path("src/battle_script_commands.c").read_text()
          assert battle.count("ApplyAdaptiveGeneDamageModifier(gBattleMoveDamage, gBattlerAttacker)") == 1
          for start_token, end_token in [
              ("static void Cmd_dmgtolevel(void)\n{", "static void Cmd_psywavedamageeffect(void)"),
              ("static void Cmd_psywavedamageeffect(void)\n{", "static void Cmd_counterdamagecalculator(void)"),
              ("static void Cmd_tryKO(void)\n{", "static void Cmd_damagetohalftargethp(void)"),
              ("static void Cmd_weatherdamage(void)\n{", "static void Cmd_tryinfatuating(void)"),
          ]:
              start = battle.rindex(start_token)
              end = battle.index(end_token, start + len(start_token))
              block = battle[start:end]
              assert "ApplyAdaptiveGeneDamageModifier" not in block

          print("STARTCORE STATIC PASS all stone shops Brick; no Gene map source; success-only evo consumption gate; fixed/OHKO/passive exclusions; narrow Gene hook")
          PY

      - name: Build QA ROM
        run: |
          set -euxo pipefail
          make
          test -f pokefirered.gba
          sha1sum pokefirered.gba | tee STARTCORE003_ROM_SHA1.txt
          git rev-parse HEAD | tee STARTCORE003_SOURCE_SHA.txt

      - name: Runtime phase 1
        run: |
          set -euxo pipefail
          rm -f pokefirered.sav
          export SDL_VIDEODRIVER=dummy
          export SDL_AUDIODRIVER=dummy
          timeout --signal=TERM 10s mgba -l 31 pokefirered.gba > startcore_phase1.log 2>&1 || test $? -eq 124 -o $? -eq 143
          cat startcore_phase1.log
          grep -q "STARTCORE PHASE1 PASS six path matrix saved" startcore_phase1.log
          test -f pokefirered.sav

      - name: Runtime phase 2
        run: |
          set -euxo pipefail
          export SDL_VIDEODRIVER=dummy
          export SDL_AUDIODRIVER=dummy
          timeout --signal=TERM 10s mgba -l 31 pokefirered.gba > startcore_phase2.log 2>&1 || test $? -eq 124 -o $? -eq 143
          cat startcore_phase2.log
          grep -q "STARTCORE PASS six starter mode paths marker death save reload" startcore_phase2.log

      - name: Reject failures
        run: |
          set -euxo pipefail
          ! grep -h "STARTCORE FAIL" startcore_phase*.log

      - uses: actions/upload-artifact@v4
        with:
          name: start-core003-runtime-matrix
          path: |
            pokefirered.gba
            pokefirered.sav
            STARTCORE003_ROM_SHA1.txt
            STARTCORE003_SOURCE_SHA.txt
            startcore_phase1.log
            startcore_phase2.log
          if-no-files-found: error
