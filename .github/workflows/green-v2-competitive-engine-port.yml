name: Green v2 exact competitive trainer engine port
on:
  push:
    branches:
      - sam/green-main-rival-production-v2

permissions:
  contents: write

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sam/green-main-rival-production-v2
          fetch-depth: 0
      - name: Port recovered exact trainer engine commits
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick ff7e05426707b60d2ffcd74e99e91289ca9016f1
          git cherry-pick f3a5c7b407f92a4822551b75a815746cc2c35574
          git cherry-pick 729c106e51c71cfd906de9981db9a20fba61a655
          git cherry-pick e40966c2e64da22268b87148401d69d06e816500
          git rm .github/workflows/green-v2-competitive-engine-port.yml
          git commit -m "Green: remove temporary competitive engine port workflow"
          git push origin HEAD:sam/green-main-rival-production-v2
