name: Apply Gym2 Cerulean Satoshi bindings

on:
  push:
    branches:
      - sam/gym2-cerulean-satoshi-bindings
    paths:
      - .github/workflows/apply-gym2-cerulean-satoshi-bindings.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sam/gym2-cerulean-satoshi-bindings
          fetch-depth: 0
      - name: Bind staged Cerulean Satoshi parties
        run: |
          python3 - <<'PY'
          from pathlib import Path

          data_c = Path('src/data.c')
          text = data_c.read_text()
          include = '#include "data/sam_satoshi_cerulean_parties.h"\n'
          anchor = '#include "data/trainer_parties.h"\n'
          if include not in text:
              if anchor not in text:
                  raise SystemExit('trainer_parties include anchor not found')
              data_c.write_text(text.replace(anchor, anchor + include, 1))

          trainers = Path('src/data/trainers.h')
          text = trainers.read_text()
          if '[TRAINER_SATOSHI_CERULEAN_PRACTICE]' not in text:
              marker = '    [TRAINER_HIKER_CLIFF_PEWTER] = {'
              if marker not in text:
                  raise SystemExit('Pewter trainer insertion anchor not found')
              lines = [
                  '    [TRAINER_SATOSHI_CERULEAN_PRACTICE] = {',
                  '        .trainerClass = TRAINER_CLASS_PKMN_TRAINER,',
                  '        .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_MALE,',
                  '        .trainerPic = TRAINER_PIC_SATOSHI,',
                  '        .trainerName = _("SATOSHI"),',
                  '        .items = {},',
                  '        .doubleBattle = FALSE,',
                  '        .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE,',
                  '        .party = NO_ITEM_CUSTOM_MOVES(sParty_SatoshiCeruleanPractice),',
                  '    },',
                  '    [TRAINER_SATOSHI_CERULEAN_REMATCH] = {',
                  '        .trainerClass = TRAINER_CLASS_PKMN_TRAINER,',
                  '        .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_MALE,',
                  '        .trainerPic = TRAINER_PIC_SATOSHI,',
                  '        .trainerName = _("SATOSHI"),',
                  '        .items = {ITEM_FULL_RESTORE},',
                  '        .doubleBattle = FALSE,',
                  '        .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE | AI_SCRIPT_TRY_TO_FAINT | AI_SCRIPT_CHECK_VIABILITY,',
                  '        .party = ITEM_CUSTOM_MOVES(sParty_SatoshiCeruleanRematch),',
                  '    },',
                  '',
              ]
              block = '\n'.join(lines)
              trainers.write_text(text.replace(marker, block + marker, 1))
          PY
      - name: Commit production binding and remove one-shot workflow
        run: |
          rm .github/workflows/apply-gym2-cerulean-satoshi-bindings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data.c src/data/trainers.h .github/workflows/apply-gym2-cerulean-satoshi-bindings.yml
          git commit -m "SATOSHI: bind Cerulean practice and rematch trainers"
          git push origin HEAD:sam/gym2-cerulean-satoshi-bindings
