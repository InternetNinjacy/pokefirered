name: Thomas Chunk 1 Edit Helper

on:
  push:
    branches:
      - sam/thomas-chunk1-trainer-foundation

permissions:
  contents: write

jobs:
  apply-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sam/thomas-chunk1-trainer-foundation
          fetch-depth: 0
      - name: Apply Thomas trainer foundation delta
        shell: python
        run: |
          from pathlib import Path

          opponents = Path("include/constants/opponents.h")
          text = opponents.read_text()
          assert "TRAINER_THOMAS_NUGGET_BRIDGE" not in text
          anchor = "#define TRAINER_LEADER_SURGE_REMATCH_VERMILION      783\n\n// Blue League branch allocations: 800-803."
          replacement = """#define TRAINER_LEADER_SURGE_REMATCH_VERMILION      783

// Thomas Team Rocket rival central allocations: 784-789.
#define TRAINER_THOMAS_NUGGET_BRIDGE                784
#define TRAINER_THOMAS_CELADON_HIDEOUT              785
#define TRAINER_THOMAS_POKEMON_TOWER                786
#define TRAINER_THOMAS_SILPH_CO                     787
#define TRAINER_THOMAS_CINNABAR_MANSION             788
#define TRAINER_THOMAS_VIRIDIAN_GYM                 789

// Blue League branch allocations: 800-803."""
          assert anchor in text
          text = text.replace(anchor, replacement, 1)
          assert "#define NUM_TRAINERS                             784" in text
          text = text.replace("#define NUM_TRAINERS                             784", "#define NUM_TRAINERS                             790", 1)
          opponents.write_text(text)

          data_c = Path("src/data.c")
          text = data_c.read_text()
          assert '#include "data/sam_thomas_trainer_parties.h"' not in text
          anchor = '#include "data/sam_satoshi_viridian_parties.h"\n#include "data/text/trainer_class_names.h"'
          replacement = '#include "data/sam_satoshi_viridian_parties.h"\n#include "data/sam_thomas_trainer_parties.h"\n#include "data/text/trainer_class_names.h"'
          assert anchor in text
          data_c.write_text(text.replace(anchor, replacement, 1))

          trainers = Path("src/data/trainers.h")
          text = trainers.read_text()
          assert "TRAINER_THOMAS_NUGGET_BRIDGE" not in text
          records = r'''
    [TRAINER_THOMAS_NUGGET_BRIDGE] = {
        .trainerClass = TRAINER_CLASS_TEAM_ROCKET,
        .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_AQUA,
        .trainerPic = TRAINER_PIC_ROCKET_GRUNT_M,
        .trainerName = _("THOMAS"),
        .items = {},
        .doubleBattle = FALSE,
        .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE | AI_SCRIPT_TRY_TO_FAINT | AI_SCRIPT_CHECK_VIABILITY,
        .party = NO_ITEM_CUSTOM_MOVES(sParty_ThomasBattle1),
    },
    [TRAINER_THOMAS_CELADON_HIDEOUT] = {
        .trainerClass = TRAINER_CLASS_TEAM_ROCKET,
        .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_AQUA,
        .trainerPic = TRAINER_PIC_ROCKET_GRUNT_M,
        .trainerName = _("THOMAS"),
        .items = {},
        .doubleBattle = FALSE,
        .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE | AI_SCRIPT_TRY_TO_FAINT | AI_SCRIPT_CHECK_VIABILITY,
        .party = NO_ITEM_CUSTOM_MOVES(sParty_ThomasBattle2),
    },
    [TRAINER_THOMAS_POKEMON_TOWER] = {
        .trainerClass = TRAINER_CLASS_TEAM_ROCKET,
        .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_AQUA,
        .trainerPic = TRAINER_PIC_ROCKET_GRUNT_M,
        .trainerName = _("THOMAS"),
        .items = {},
        .doubleBattle = FALSE,
        .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE | AI_SCRIPT_TRY_TO_FAINT | AI_SCRIPT_CHECK_VIABILITY,
        .party = NO_ITEM_CUSTOM_MOVES(sParty_ThomasBattle3),
    },
    [TRAINER_THOMAS_SILPH_CO] = {
        .trainerClass = TRAINER_CLASS_TEAM_ROCKET,
        .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_AQUA,
        .trainerPic = TRAINER_PIC_ROCKET_GRUNT_M,
        .trainerName = _("THOMAS"),
        .items = {},
        .doubleBattle = FALSE,
        .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE | AI_SCRIPT_TRY_TO_FAINT | AI_SCRIPT_CHECK_VIABILITY,
        .party = ITEM_CUSTOM_MOVES(sParty_ThomasBattle4),
    },
    [TRAINER_THOMAS_CINNABAR_MANSION] = {
        .trainerClass = TRAINER_CLASS_TEAM_ROCKET,
        .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_AQUA,
        .trainerPic = TRAINER_PIC_ROCKET_GRUNT_M,
        .trainerName = _("THOMAS"),
        .items = {},
        .doubleBattle = FALSE,
        .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE | AI_SCRIPT_TRY_TO_FAINT | AI_SCRIPT_CHECK_VIABILITY,
        .party = ITEM_CUSTOM_MOVES(sParty_ThomasBattle5),
    },
    [TRAINER_THOMAS_VIRIDIAN_GYM] = {
        .trainerClass = TRAINER_CLASS_TEAM_ROCKET,
        .encounterMusic_gender = TRAINER_ENCOUNTER_MUSIC_AQUA,
        .trainerPic = TRAINER_PIC_ROCKET_GRUNT_M,
        .trainerName = _("THOMAS"),
        .items = {},
        .doubleBattle = FALSE,
        .aiFlags = AI_SCRIPT_CHECK_BAD_MOVE | AI_SCRIPT_TRY_TO_FAINT | AI_SCRIPT_CHECK_VIABILITY,
        .party = ITEM_CUSTOM_MOVES(sParty_ThomasBattle6),
    },
'''
          close = text.rfind("    };")
          assert close != -1
          text = text[:close] + records + text[close:]
          trainers.write_text(text)
      - name: Commit production delta
        shell: bash
        run: |
          if git diff --quiet -- include/constants/opponents.h src/data.c src/data/trainers.h; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/constants/opponents.h src/data.c src/data/trainers.h
          git commit -m "Thomas: wire six trainer records"
          git push origin HEAD:sam/thomas-chunk1-trainer-foundation
